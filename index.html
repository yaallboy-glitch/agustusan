<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agustusan Pemutar Lagu</title>
    <style>
        :root {
            --primary-red: #E10000;
            --dark-red: #B30000;
            --white: #FFFFFF;
            --bg-color: #F5F5F5;
            --text-dark: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--white);
            width: 100%;
            max-width: 1000px; /* Lebar maksimal untuk layar besar */
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--primary-red);
            color: var(--white);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 3px solid var(--dark-red);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-profile span {
            cursor: text;
            outline: none;
            font-weight: bold;
            min-width: 50px;
            display: inline-block;
        }

        /* Layout Pemutar di Atas Tengah */
        .player-section {
            padding: 30px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 40px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }

        .cover-art {
            width: 150px;
            height: 150px;
            background: var(--primary-red);
            border-radius: 10px;
            overflow: hidden;
            border: 4px solid var(--white);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--white);
            font-weight: bold;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.4;
            flex-shrink: 0;
        }

        .player-details {
            flex: 1;
            max-width: 500px;
        }

        .song-title {
            margin: 0;
            font-size: 1.8rem;
            color: var(--text-dark);
        }

        .song-rt {
            color: #777;
            font-size: 1rem;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #ddd;
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-red);
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #666;
            margin-top: 8px;
        }

        .controls {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 25px;
            margin-top: 10px;
        }

        .btn-control {
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-control:hover {
            transform: scale(1.15);
            color: var(--primary-red);
        }

        .btn-play {
            font-size: 3rem;
            color: var(--primary-red);
        }

        /* Layout Playlist di Bawah */
        .playlist-section {
            padding: 20px 30px 30px;
            background: var(--white);
        }

        .playlist-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-dark);
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-items {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Membagi menjadi 3 kolom */
            gap: 10px;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            background: #f9f9f9;
            border: 1px solid #eee;
        }

        .playlist-item:hover {
            background-color: #ffe5e5;
            border-color: var(--primary-red);
        }

        .playlist-item.active {
            background-color: var(--primary-red);
            color: var(--white);
            border-color: var(--dark-red);
        }

        .playlist-item .rt-label {
            font-weight: bold;
            font-size: 0.9rem;
            min-width: 50px;
        }

        .playlist-item .song-name {
            font-size: 0.9rem;
            text-align: right;
            flex: 1;
            margin-left: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .add-song-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: var(--white);
            border: 2px dashed #ccc;
            color: #666;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-song-btn:hover {
            border-color: var(--primary-red);
            color: var(--primary-red);
            background: #fff5f5;
        }

        .footer {
            background-color: #f0f0f0;
            padding: 15px 25px;
            text-align: center;
            font-size: 0.85rem;
            color: #555;
            border-top: 1px solid #ddd;
        }

        .footer strong {
            color: var(--primary-red);
            display: block;
            margin-bottom: 4px;
            font-size: 1rem;
        }

        audio {
            display: none;
        }

        /* Responsif untuk layar kecil (Tablet/HP) */
        @media (max-width: 768px) {
            .player-section {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            .controls {
                justify-content: center;
            }
            .playlist-items {
                grid-template-columns: repeat(2, 1fr); /* 2 kolom di tablet */
            }
        }
        @media (max-width: 480px) {
            .playlist-items {
                grid-template-columns: 1fr; /* 1 kolom di HP */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-title">
                <span>🔊 AGUSTUSAN PEMUTAR LAGU</span>
            </div>
            <div class="user-profile">
                Nama: <span contenteditable="true" id="userName">Tamu</span>
            </div>
        </div>

        <!-- Pemutar Lagu (Atas Tengah) -->
        <div class="player-section">
            <div class="cover-art" id="coverArt">
                DIRGAHAYU<br>INDONESIA
            </div>
            <div class="player-details">
                <h2 class="song-title" id="songTitle">Indonesia Pusaka</h2>
                <p class="song-rt" id="songRT">RT 01</p>

                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">00:00</span>
                        <span id="durationTime">00:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn-control" id="prevBtn">⏮</button>
                    <button class="btn-control btn-play" id="playPauseBtn">▶️</button>
                    <button class="btn-control" id="nextBtn">⏭</button>
                </div>
            </div>
        </div>

        <!-- Daftar Lagu (Bawah) -->
        <div class="playlist-section">
            <div class="playlist-title">
                <span>DAFTAR LAGU TIAP RT</span>
                <span id="songCount" style="font-weight: normal; font-size: 0.9rem; color: #666;">15 Lagu</span>
            </div>
            <div class="playlist-items" id="playlistContainer">
                <!-- Diisi oleh JavaScript -->
            </div>
            
            <!-- Input File Disembunyikan -->
            <input type="file" id="fileInput" accept="audio/*" style="display: none;">
            <button class="add-song-btn" id="uploadBtn">+ Tambah Lagu dari Storage</button>
        </div>

        <div class="footer">
            <strong>Dirgahayu Republik Indonesia!</strong>
            Semangat Kebersamaan, Meriahkan Agustusan!
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // Data Awal Lagu
        const songs = [
            { rt: "RT 01", title: "Indonesia Pusaka", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 02", title: "Bagimu Negeri", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 03", title: "Garuda Pancasila", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 04", title: "Halo-Halo Bandung", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 05", title: "Maju Tak Gentar", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 06", title: "Bangun Pemudi Pemuda", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 07", title: "Berita Kepada Kawan", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 08", title: "Dari Sabang Sampai Merauke", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 09", title: "Gugur Bunga", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 10", title: "Indonesia Jaya", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 11", title: "Ibu Pertiwi", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 12", title: "Melati Suci", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 13", title: "Nenek Moyangku Pelaut", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-13.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 14", title: "Pemuda", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-14.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 15", title: "Satu Nusa Satu Bangsa", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3", cover: "DIRGAHAYU<br>INDONESIA" }
        ];

        let currentSongIndex = 0;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const songTitle = document.getElementById('songTitle');
        const songRT = document.getElementById('songRT');
        const coverArt = document.getElementById('coverArt');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const playlistContainer = document.getElementById('playlistContainer');
        const songCount = document.getElementById('songCount');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');

        // Render Playlist
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            songCount.textContent = `${songs.length} Lagu`;
            
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.classList.add('playlist-item');
                if (index === currentSongIndex) {
                    item.classList.add('active');
                }
                item.innerHTML = `
                    <span class="rt-label">${song.rt}</span>
                    <span class="song-name">${song.title}</span>
                `;
                item.addEventListener('click', () => {
                    loadSong(index);
                });
                playlistContainer.appendChild(item);
            });
        }

        // Load Song (Hanya memuat, TIDAK langsung play)
        function loadSong(index) {
            currentSongIndex = index;
            const song = songs[index];
            songTitle.textContent = song.title;
            songRT.textContent = song.rt;
            coverArt.innerHTML = song.cover;
            audioPlayer.src = song.src;
            
            pauseSong(); 
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '00:00';
            durationTimeEl.textContent = '00:00';
            
            renderPlaylist();
        }

        function playSong() {
            isPlaying = true;
            playPauseBtn.innerHTML = '⏸️';
            audioPlayer.play();
        }

        function pauseSong() {
            isPlaying = false;
            playPauseBtn.innerHTML = '▶️';
            audioPlayer.pause();
        }

        function prevSong() {
            currentSongIndex--;
            if (currentSongIndex < 0) currentSongIndex = songs.length - 1;
            loadSong(currentSongIndex);
            if(isPlaying) playSong(); 
        }

        function nextSong() {
            currentSongIndex++;
            if (currentSongIndex > songs.length - 1) currentSongIndex = 0;
            loadSong(currentSongIndex);
            if(isPlaying) playSong();
        }

        function updateProgress(e) {
            const { duration, currentTime } = e.srcElement;
            if (duration) {
                const progressPercent = (currentTime / duration) * 100;
                progressFill.style.width = `${progressPercent}%`;
                currentTimeEl.textContent = formatTime(currentTime);
                durationTimeEl.textContent = formatTime(duration);
            }
        }

        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            const duration = audioPlayer.duration;
            if (duration) audioPlayer.currentTime = (clickX / width) * duration;
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Event Listeners
        playPauseBtn.addEventListener('click', () => isPlaying ? pauseSong() : playSong());
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('ended', nextSong);
        progressBar.addEventListener('click', setProgress);

        // Fitur Upload dari Storage
        uploadBtn.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const songUrl = URL.createObjectURL(file);
                const songName = file.name.replace(/\.[^/.]+$/, ""); // Hapus ekstensi .mp3 dll
                
                // Tambahkan ke array songs
                songs.push({
                    rt: "UPLOAD",
                    title: songName,
                    src: songUrl,
                    cover: "LAGU<br>UPLOAD"
                });
                
                renderPlaylist();
                // Opsional: Langsung load lagu yang baru diupload
                loadSong(songs.length - 1);
                
                // Reset input agar bisa upload file dengan nama yang sama lagi
                fileInput.value = '';
            }
        });

        // Initial Load
        loadSong(0);
    </script>
</body>
</html>
