<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agustusan Max Music Player</title>
    <style>
        :root {
            --primary-red: #E10000;
            --dark-red: #B30000;
            --white: #FFFFFF;
            --text-dark: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--white);
            width: 100%;
            max-width: 1000px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: var(--primary-red);
            color: var(--white);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 3px solid var(--dark-red);
        }

        /* Mengganti User Profile menjadi Tombol Soundboard */
        .soundboard-btn {
            background: rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.4);
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .soundboard-btn:hover {
            background: rgba(255,255,255,0.4);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .left-panel {
            padding: 25px;
            border-right: 1px solid #eee;
        }

        .player-section {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .cover-art {
            width: 150px;
            height: 150px;
            background: var(--primary-red);
            border-radius: 10px;
            overflow: hidden;
            border: 4px solid var(--white);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--white);
            font-weight: bold;
            text-align: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .player-details { flex: 1; }
        .song-title { margin: 0; font-size: 1.6rem; color: var(--text-dark); }
        .song-rt { color: #777; font-size: 1rem; margin-top: 5px; margin-bottom: 20px; }

        .progress-bar {
            width: 100%; height: 6px; background-color: #ddd;
            border-radius: 3px; overflow: hidden; cursor: pointer;
        }
        .progress-fill { height: 100%; background: var(--primary-red); width: 0%; transition: width 0.1s linear; }
        .time-display { display: flex; justify-content: space-between; font-size: 0.85rem; color: #666; margin-top: 8px; }

        .controls { display: flex; justify-content: center; align-items: center; gap: 25px; margin-top: 20px; }
        .btn-control { background: none; border: none; font-size: 1.8rem; color: var(--text-dark); cursor: pointer; }
        .btn-control:hover { color: var(--primary-red); }
        .btn-play { font-size: 3rem; color: var(--primary-red); }

        .playlist-section { margin-top: 10px; }
        .playlist-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: var(--text-dark); border-bottom: 2px solid var(--primary-red); padding-bottom: 10px; }
        .playlist-items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 300px; overflow-y: auto; }
        .playlist-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 6px; cursor: pointer; background: #f9f9f9; border: 1px solid #eee; }
        .playlist-item:hover { background-color: #ffe5e5; }
        .playlist-item.active { background-color: var(--primary-red); color: var(--white); }
        .rt-label { font-weight: bold; font-size: 0.9rem; }
        .song-name { font-size: 0.9rem; text-align: right; margin-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .add-song-btn { display: block; width: 100%; margin-top: 15px; padding: 12px; background: var(--white); border: 2px dashed #ccc; color: #666; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .add-song-btn:hover { border-color: var(--primary-red); color: var(--primary-red); }

        .right-panel {
            padding: 25px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
        }

        .enhancer-title {
            font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; color: var(--text-dark);
            border-bottom: 2px solid var(--primary-red); padding-bottom: 10px;
        }

        .knob-group { margin-bottom: 30px; }
        .knob-label { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: bold; color: #555; margin-bottom: 10px; }
        .knob-value { color: var(--primary-red); }
        
        input[type="range"] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 8px; background: #ddd; border-radius: 5px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 20px; height: 20px; background: var(--primary-red); border-radius: 50%; cursor: pointer; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px; height: 20px; background: var(--primary-red); border-radius: 50%; cursor: pointer; border: 2px solid white;
        }

        .preset-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .preset-btn { padding: 10px; background: var(--white); border: 1px solid var(--primary-red); color: var(--primary-red); border-radius: 6px; font-weight: bold; cursor: pointer; }
        .preset-btn:hover { background: var(--primary-red); color: var(--white); }

        .footer { background-color: #f0f0f0; padding: 15px 25px; text-align: center; font-size: 0.85rem; color: #555; }
        .footer strong { color: var(--primary-red); display: block; margin-bottom: 4px; font-size: 1rem; }

        audio { display: none; }

        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
            .left-panel { border-right: none; border-bottom: 1px solid #eee; }
            .player-section { flex-direction: column; text-align: center; }
            .playlist-items { grid-template-columns: 1fr; }
        }

        /* ==================== */
        /* CSS SOUNDBOARD MODE */
        /* ==================== */
        #soundboardModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }
        .sb-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 15px;
            padding: 20px;
        }
        .sb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 10px;
        }
        .sb-header h2 { margin: 0; color: var(--primary-red); }
        .sb-close-btn {
            background: var(--primary-red);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .sb-upload-btn {
            width: 100%;
            margin-bottom: 20px;
            padding: 12px;
            background: #fff;
            border: 2px dashed var(--primary-red);
            color: var(--primary-red);
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .sb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .sb-item {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sb-title {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-dark);
            font-size: 0.9rem;
        }
        .sb-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .sb-btn {
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            border: none;
            font-weight: bold;
        }
        .sb-btn.play { background: var(--primary-red); color: #fff; }
        .sb-btn.pause { background: #ccc; color: #333; }
        .sb-btn.stop { background: #333; color: #fff; }
        .sb-btn.repeat { background: #fff; color: var(--primary-red); border: 1px solid var(--primary-red); }
        .sb-btn.repeat.active { background: var(--primary-red); color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>🔊 AGUSTUSAN MAX PLAYER</div>
            <!-- Mengganti Nama: Tamu menjadi Tombol Mode Soundboard -->
            <button class="soundboard-btn" id="soundboardBtn">🎛️ Mode Soundboard</button>
        </div>

        <div class="main-layout">
            <div class="left-panel">
                <div class="player-section">
                    <div class="cover-art" id="coverArt">DIRGAHAYU<br>INDONESIA</div>
                    <div class="player-details">
                        <h2 class="song-title" id="songTitle">Pilih Lagu</h2>
                        <p class="song-rt" id="songRT">RT --</p>
                        <div class="progress-container">
                            <div class="progress-bar" id="progressBar">
                                <div class="progress-fill" id="progressFill"></div>
                            </div>
                            <div class="time-display">
                                <span id="currentTime">00:00</span>
                                <span id="durationTime">00:00</span>
                            </div>
                        </div>
                        <div class="controls">
                            <button class="btn-control" id="prevBtn">⏮</button>
                            <button class="btn-control btn-play" id="playPauseBtn">▶️</button>
                            <button class="btn-control" id="nextBtn">⏭</button>
                        </div>
                    </div>
                </div>

                <div class="playlist-section">
                    <div class="playlist-title">DAFTAR LAGU</div>
                    <div class="playlist-items" id="playlistContainer"></div>
                    <input type="file" id="fileInput" accept="audio/*" style="display: none;">
                    <button class="add-song-btn" id="uploadBtn">+ Upload MP3 dari Storage</button>
                </div>
            </div>

            <div class="right-panel">
                <div class="enhancer-title">🎚️ AUDIO MAXIMIZER</div>
                
                <div class="knob-group">
                    <div class="knob-label">
                        <span>Volume Boost (Gain)</span>
                        <span class="knob-value" id="gainValue">100%</span>
                    </div>
                    <input type="range" id="gainSlider" min="100" max="300" value="100">
                </div>

                <div class="knob-group">
                    <div class="knob-label">
                        <span>Bass Boost (Low)</span>
                        <span class="knob-value" id="bassValue">0 dB</span>
                    </div>
                    <input type="range" id="bassSlider" min="-10" max="20" value="0">
                </div>

                <div class="knob-group">
                    <div class="knob-label">
                        <span>Treble Enhancer (High)</span>
                        <span class="knob-value" id="trebleValue">0 dB</span>
                    </div>
                    <input type="range" id="trebleSlider" min="-10" max="20" value="0">
                </div>

                <div class="preset-btns">
                    <button class="preset-btn" onclick="setPreset(100, 0, 0)">Normal</button>
                    <button class="preset-btn" onclick="setPreset(200, 15, 5)">Max Bass</button>
                    <button class="preset-btn" onclick="setPreset(250, 10, 15)">Live Concert</button>
                    <button class="preset-btn" onclick="setPreset(300, 20, 20)">Ultra Max</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <strong>Dirgahayu Republik Indonesia!</strong>
            Audio diolah maksimal menggunakan Web Audio API
        </div>
    </div>

    <!-- HTML MODAL SOUNDBOARD (Fullscreen Grid) -->
    <div id="soundboardModal">
        <div class="sb-container">
            <div class="sb-header">
                <h2>🎛️ MODE SOUNDBOARD</h2>
                <button class="sb-close-btn" id="closeSoundboardBtn">Tutup (X)</button>
            </div>
            <input type="file" id="sbFileInput" accept="audio/*" multiple style="display: none;">
            <button class="sb-upload-btn" id="sbUploadBtn">+ Tambah Lagu ke Soundboard</button>
            <div class="sb-grid" id="sbGrid">
                <!-- Item Soundboard akan diisi oleh JavaScript di sini -->
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // ==========================================
        // 1. KODE ASLI (TIDAK DIRUBAH SEDIKITPUN)
        // ==========================================
        const songs = [
            { rt: "Demo 1", title: "Indonesia Pusaka", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "Demo 2", title: "Bagimu Negeri", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "Demo 3", title: "Garuda Pancasila", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", cover: "DIRGAHAYU<br>INDONESIA" }
        ];

        let currentSongIndex = 0;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const songTitle = document.getElementById('songTitle');
        const coverArt = document.getElementById('coverArt');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const playlistContainer = document.getElementById('playlistContainer');

        let audioCtx;
        let gainNode;
        let bassFilter;
        let trebleFilter;

        function initAudioContext() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audioPlayer);
            bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = "lowshelf";
            bassFilter.frequency.value = 200;
            bassFilter.gain.value = 0;
            trebleFilter = audioCtx.createBiquadFilter();
            trebleFilter.type = "highshelf";
            trebleFilter.frequency.value = 3000;
            trebleFilter.gain.value = 0;
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 1.0;
            source.connect(bassFilter);
            bassFilter.connect(trebleFilter);
            trebleFilter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
        }

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.classList.add('playlist-item');
                if (index === currentSongIndex) item.classList.add('active');
                item.innerHTML = `<span class="rt-label">${song.rt}</span><span class="song-name">${song.title}</span>`;
                item.addEventListener('click', () => loadSong(index));
                playlistContainer.appendChild(item);
            });
        }

        function loadSong(index) {
            currentSongIndex = index;
            const song = songs[index];
            songTitle.textContent = song.title;
            coverArt.innerHTML = song.cover;
            audioPlayer.src = song.src;
            pauseSong();
            renderPlaylist();
        }

        function playSong() {
            initAudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isPlaying = true;
            playPauseBtn.innerHTML = '⏸️';
            audioPlayer.play();
        }

        function pauseSong() {
            isPlaying = false;
            playPauseBtn.innerHTML = '▶️';
            audioPlayer.pause();
        }

        document.getElementById('gainSlider').addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('gainValue').innerText = val + '%';
            if (gainNode) gainNode.gain.value = val / 100;
        });

        document.getElementById('bassSlider').addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('bassValue').innerText = val + ' dB';
            if (bassFilter) bassFilter.gain.value = val;
        });

        document.getElementById('trebleSlider').addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('trebleValue').innerText = val + ' dB';
            if (trebleFilter) trebleFilter.gain.value = val;
        });

        function setPreset(gain, bass, treble) {
            document.getElementById('gainSlider').value = gain;
            document.getElementById('bassSlider').value = bass;
            document.getElementById('trebleSlider').value = treble;
            document.getElementById('gainSlider').dispatchEvent(new Event('input'));
            document.getElementById('bassSlider').dispatchEvent(new Event('input'));
            document.getElementById('trebleSlider').dispatchEvent(new Event('input'));
        }

        playPauseBtn.addEventListener('click', () => isPlaying ? pauseSong() : playSong());
        audioPlayer.addEventListener('timeupdate', () => {
            const { duration, currentTime } = audioPlayer;
            const progressPercent = (currentTime / duration) * 100;
            progressFill.style.width = `${progressPercent}%`;
            document.getElementById('currentTime').textContent = formatTime(currentTime);
            document.getElementById('durationTime').textContent = formatTime(duration);
        });
        progressBar.addEventListener('click', (e) => {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            audioPlayer.currentTime = (clickX / width) * audioPlayer.duration;
        });

        document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('fileInput').click());
        document.getElementById('fileInput').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const songUrl = URL.createObjectURL(file);
                const songName = file.name.replace(/\.[^/.]+$/, "");
                songs.push({ rt: "UPLOAD", title: songName, src: songUrl, cover: "LAGU<br>UPLOAD" });
                renderPlaylist();
                loadSong(songs.length - 1);
                event.target.value = '';
            }
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        renderPlaylist();
        loadSong(0);

        // ==========================================
        // 2. TAMBAHAN FITUR SOUNDBOARD (REQUEST BARU)
        // ==========================================
        const soundboardBtn = document.getElementById('soundboardBtn');
        const soundboardModal = document.getElementById('soundboardModal');
        const closeSoundboardBtn = document.getElementById('closeSoundboardBtn');
        const sbUploadBtn = document.getElementById('sbUploadBtn');
        const sbFileInput = document.getElementById('sbFileInput');
        const sbGrid = document.getElementById('sbGrid');

        // Buka modal fullscreen
        soundboardBtn.addEventListener('click', () => {
            soundboardModal.style.display = 'block';
        });

        // Tutup modal fullscreen
        closeSoundboardBtn.addEventListener('click', () => {
            soundboardModal.style.display = 'none';
        });

        // Klik tombol upload di soundboard
        sbUploadBtn.addEventListener('click', () => sbFileInput.click());

        // Proses file yang diupload ke soundboard
        sbFileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const url = URL.createObjectURL(file);
                const name = file.name.replace(/\.[^/.]+$/, "");
                
                // Buat kotak grid untuk setiap lagu
                const item = document.createElement('div');
                item.className = 'sb-item';
                item.innerHTML = `
                    <div class="sb-title">${name}</div>
                    <div class="sb-controls">
                        <button class="sb-btn play">Play</button>
                        <button class="sb-btn pause">Pause</button>
                        <button class="sb-btn stop">Stop</button>
                        <button class="sb-btn repeat">Repeat: Off</button>
                    </div>
                    <audio src="${url}" style="display:none;"></audio>
                `;
                sbGrid.appendChild(item);

                // Ambil elemen elemen di dalam kotak ini
                const audio = item.querySelector('audio');
                const playBtn = item.querySelector('.play');
                const pauseBtn = item.querySelector('.pause');
                const stopBtn = item.querySelector('.stop');
                const repeatBtn = item.querySelector('.repeat');

                // Kontrol individu per lagu
                playBtn.addEventListener('click', () => audio.play());
                pauseBtn.addEventListener('click', () => audio.pause());
                stopBtn.addEventListener('click', () => {
                    audio.pause();
                    audio.currentTime = 0;
                });
                
                // Fitur Repeat per lagu
                repeatBtn.addEventListener('click', () => {
                    if(audio.loop) {
                        audio.loop = false;
                        repeatBtn.innerText = "Repeat: Off";
                        repeatBtn.classList.remove('active');
                    } else {
                        audio.loop = true;
                        repeatBtn.innerText = "Repeat: On";
                        repeatBtn.classList.add('active');
                    }
                });
            });
            e.target.value = ''; // Reset input biar bisa upload file yang sama lagi
        });
    </script>
</body>
</html>
