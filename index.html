<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agustusan Pemutar Lagu</title>
    <style>
        :root {
            --primary-red: #E10000;
            --dark-red: #B30000;
            --white: #FFFFFF;
            --bg-color: #F5F5F5;
            --text-dark: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--white);
            width: 100%;
            max-width: 1000px; /* Lebar maksimal untuk layar besar */
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Tampilan saat fullscreen -- isi layar penuh, tanpa sudut membulat */
        .container:fullscreen,
        .container:-webkit-full-screen {
            max-width: 100%;
            width: 100%;
            height: 100%;
            border-radius: 0;
            justify-content: center;
            background-color: var(--white);
            /* PENTING: harus bisa di-scroll sendiri di dalam sini.
               Kalau overflow-nya "hidden" (warisan dari .container biasa)
               dan konten (playlist dll) lebih tinggi dari layar, jari yang
               geser ke atas/bawah tidak nge-scroll apa-apa -- gerakannya
               malah "bocor" ke browser/OS dan ditangkap sebagai gestur
               keluar dari fullscreen. Dengan overflow-y:auto, geseran akan
               dipakai untuk scroll konten dulu, jadi fullscreen tidak
               tertutup sendiri. */
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            /* Kunci arah geseran ke vertikal saja -- supaya geseran ke
               kiri/kanan (yang sering ditangkap browser/OS sebagai gestur
               "back" atau keluar fullscreen) tidak diteruskan ke luar. */
            touch-action: pan-y;
        }

        .header {
            background: var(--primary-red);
            color: var(--white);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 3px solid var(--dark-red);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-profile span {
            cursor: text;
            outline: none;
            font-weight: bold;
            min-width: 50px;
            display: inline-block;
        }

        .fullscreen-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: var(--white);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .fullscreen-btn:hover {
            background: rgba(255,255,255,0.35);
        }

        /* Layout Pemutar di Atas Tengah */
        .player-section {
            padding: 30px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 40px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }

        .cover-art {
            width: 150px;
            height: 150px;
            background: var(--primary-red);
            border-radius: 10px;
            overflow: hidden;
            border: 4px solid var(--white);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--white);
            font-weight: bold;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.4;
            flex-shrink: 0;
        }

        .player-details {
            flex: 1;
            max-width: 500px;
            min-width: 0; /* penting: biar flex item boleh menyusut, kalau
                             tidak, judul panjang tanpa spasi akan memaksa
                             lebar keluar (numpuk ke samping / bikin scroll
                             horizontal) daripada turun ke baris baru */
        }

        .song-title {
            margin: 0;
            font-size: 1.4rem; /* sedikit lebih kecil dari sebelumnya (1.8rem) */
            color: var(--text-dark);
            overflow-wrap: break-word;
            word-break: break-word;
            line-height: 1.3;
        }

        .song-rt {
            color: #777;
            font-size: 1rem;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #ddd;
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-red);
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #666;
            margin-top: 8px;
        }

        .controls {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        .btn-control {
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }

        .btn-control:hover {
            transform: scale(1.15);
            color: var(--primary-red);
        }

        .btn-play {
            font-size: 3rem;
            color: var(--primary-red);
        }

        /* Tombol shuffle & repeat -- lebih kecil dari tombol utama, ada state aktif */
        .btn-toggle {
            font-size: 1.2rem;
            opacity: 0.45;
        }

        .btn-toggle.active {
            opacity: 1;
            color: var(--primary-red);
        }

        /* Volume */
        .extra-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .pill-btn {
            border: 1.5px solid #ddd;
            background: var(--white);
            color: #888;
            font-size: 0.72rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .pill-btn:hover {
            border-color: var(--primary-red);
            color: var(--primary-red);
        }

        .pill-btn.active {
            background: var(--primary-red);
            border-color: var(--primary-red);
            color: var(--white);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-container span {
            font-size: 1.1rem;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .volume-container input[type="range"] {
            flex: 1;
            max-width: 160px;
            accent-color: var(--primary-red);
            cursor: pointer;
        }

        /* Layout Playlist di Bawah */
        .playlist-section {
            padding: 20px 30px 30px;
            background: var(--white);
        }

        .playlist-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-dark);
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Saklar Preset -- 15 Lagu RT vs Playlist Biasa */
        .mode-switcher {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .mode-btn {
            flex: 1;
            border: 1.5px solid #ddd;
            background: var(--white);
            color: #888;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn:hover {
            border-color: var(--primary-red);
            color: var(--primary-red);
        }

        .mode-btn.active {
            background: var(--primary-red);
            border-color: var(--primary-red);
            color: var(--white);
        }

        .playlist-items {
            display: grid;
            /* minmax(0, 1fr), BUKAN cuma "1fr" -- kalau cuma 1fr, kolom akan
               ikut melebar mengikuti konten yang panjang (nama lagu), jadi
               tidak rata lagi antar kolom. minmax(0, ...) mengunci kolom
               supaya tidak pernah melebihi jatah 1/3 lebar aslinya, apapun
               isinya. */
            grid-template-columns: repeat(3, minmax(0, 1fr)); /* Membagi menjadi 3 kolom */
            gap: 10px;
        }

        /* Mode Playlist Biasa -- daftar 1 kolom, lebih lega, teks lebih besar */
        .playlist-items.normal-mode {
            grid-template-columns: minmax(0, 1fr);
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            background: #f9f9f9;
            border: 1px solid #eee;
            min-width: 0; /* biar item grid tidak ikut melebar mengikuti
                             konten anaknya (lihat catatan di .playlist-items) */
        }

        .playlist-item:hover {
            background-color: #ffe5e5;
            border-color: var(--primary-red);
        }

        .playlist-item.active {
            background-color: var(--primary-red);
            color: var(--white);
            border-color: var(--dark-red);
        }

        .playlist-item .rt-label {
            font-weight: bold;
            font-size: 0.8rem;
            min-width: 42px;
        }

        .playlist-item .rt-label[contenteditable="true"] {
            cursor: text;
            outline: none;
            border-bottom: 1px dashed transparent;
        }

        .playlist-item .rt-label[contenteditable="true"]:hover,
        .playlist-item .rt-label[contenteditable="true"]:focus {
            border-bottom-color: currentColor;
        }

        .playlist-item .track-number {
            font-weight: bold;
            font-size: 0.85rem;
            opacity: 0.5;
            min-width: 26px;
        }

        .playlist-item .song-name {
            font-size: 0.9rem;
            text-align: right;
            flex: 1;
            min-width: 0; /* wajib -- flex item defaultnya min-width:auto,
                             jadi overflow:hidden di bawah ini tidak akan
                             pernah kepakai kalau baris ini tidak ada */
            margin-left: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Marquee -- judul lagu yang kepanjangan berjalan/scroll di dalam
           kotaknya sendiri, TIDAK memperlebar/mendorong kolom RT. Kalau
           judulnya pendek dan muat, tidak ada animasi sama sekali (diam). */
        .playlist-item .song-name-track {
            display: inline-flex;
            max-width: 100%;
        }
        .playlist-item .song-name .marquee-seg {
            padding-right: 28px;
        }
        .playlist-item .song-name:not(.marquee-active) .marquee-seg:last-child {
            display: none;
        }
        .playlist-item .song-name.marquee-active {
            text-overflow: unset;
        }
        .playlist-item .song-name.marquee-active .song-name-track {
            animation-name: marqueeLoop;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        @keyframes marqueeLoop {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* Preset "15 Lagu RT" -- nama lagu diperkecil biar tidak penuh,
           soalnya harus muat 15 baris sekaligus di grid 3 kolom. */
        .playlist-items.rt-mode .song-name {
            font-size: 0.74rem;
        }

        /* Preset "Playlist Biasa" -- lebih lega, nama lagu rata kiri
           mengikuti nomor urut track. */
        .playlist-items.normal-mode .song-name {
            font-size: 0.95rem;
            text-align: left;
        }

        .playlist-item .song-name.song-empty {
            font-style: italic;
            opacity: 0.55;
        }

        .playlist-empty {
            text-align: center;
            padding: 30px 15px;
            color: #999;
            font-style: italic;
            font-size: 0.95rem;
        }

        .slot-upload-btn {
            background: none;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 8px;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.2s;
        }

        .slot-upload-btn:hover {
            opacity: 1;
            transform: scale(1.15);
        }

        .add-song-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: var(--white);
            border: 2px dashed #ccc;
            color: #666;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-song-btn:hover {
            border-color: var(--primary-red);
            color: var(--primary-red);
            background: #fff5f5;
        }

        .footer {
            background-color: #f0f0f0;
            padding: 15px 25px;
            text-align: center;
            font-size: 0.85rem;
            color: #555;
            border-top: 1px solid #ddd;
        }

        .footer strong {
            color: var(--primary-red);
            display: block;
            margin-bottom: 4px;
            font-size: 1rem;
        }

        /* input file disembunyikan SECARA VISUAL (bukan display:none) --
           Safari iOS/iPadOS kadang menolak membuka jendela pilih file kalau
           inputnya display:none, walau ditrigger lewat tombol. */
        .visually-hidden-file {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border: 0;
        }

        audio {
            display: none;
        }

        /* Responsif untuk layar kecil (Tablet/HP) */
        @media (max-width: 768px) {
            .player-section {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            .controls {
                justify-content: center;
            }
            .volume-container {
                justify-content: center;
            }
            .playlist-items {
                grid-template-columns: repeat(2, minmax(0, 1fr)); /* 2 kolom di tablet */
            }
        }
        @media (max-width: 480px) {
            .playlist-items {
                grid-template-columns: minmax(0, 1fr); /* 1 kolom di HP */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-title">
                <span>🔊 AGUSTUSAN PEMUTAR LAGU</span>
            </div>
            <div class="header-right">
                <div class="user-profile">
                    Nama: <span contenteditable="true" id="userName">Tamu</span>
                </div>
                <button class="fullscreen-btn" id="fullscreenBtn" title="Layar Penuh">⛶</button>
            </div>
        </div>

        <!-- Pemutar Lagu (Atas Tengah) -->
        <div class="player-section">
            <div class="cover-art" id="coverArt">
                DIRGAHAYU<br>INDONESIA
            </div>
            <div class="player-details">
                <h2 class="song-title" id="songTitle">Indonesia Pusaka</h2>
                <p class="song-rt" id="songRT">RT 01</p>

                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">00:00</span>
                        <span id="durationTime">00:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn-control btn-toggle" id="shuffleBtn" title="Acak">🔀</button>
                    <button class="btn-control" id="prevBtn">⏮</button>
                    <button class="btn-control btn-play" id="playPauseBtn">▶️</button>
                    <button class="btn-control" id="nextBtn">⏭</button>
                    <button class="btn-control btn-toggle" id="repeatBtn" title="Ulang: Mati">🔁</button>
                    <button class="btn-control" id="stopBtn" title="Berhenti & kembali ke awal (tidak otomatis main lagi)">⏹️</button>
                </div>

                <div class="extra-controls">
                    <button class="pill-btn active" id="autoplayBtn" title="Lanjut otomatis ke lagu berikutnya: Aktif">AUTO</button>
                    <div class="volume-container">
                        <span id="volumeIcon">🔊</span>
                        <input type="range" id="volumeSlider" min="0" max="100" value="100" title="Volume">
                    </div>
                    <button class="pill-btn" id="audio8dBtn" title="Efek 8D Audio: Mati">🎧 8D</button>
                    <button class="pill-btn" id="downloadOriginalBtn" title="Unduh file lagu ini apa adanya (tanpa diproses) -- selalu berhasil berapapun panjangnya">⬇️ Unduh Asli</button>
                    <button class="pill-btn" id="downloadHQBtn" title="Render lagu ini lewat filter penjernih lalu unduh sebagai WAV (lossless) untuk diputar offline -- disarankan untuk lagu yang tidak terlalu panjang">⬇️ Unduh HQ WAV</button>
                </div>
                <div class="hq-status" id="hqStatus" style="display:none; font-size:0.78rem; color:#888; margin-top:8px;"></div>
            </div>
        </div>

        <!-- Daftar Lagu (Bawah) -->
        <div class="playlist-section">
            <div class="playlist-title">
                <span id="playlistTitleLabel">DAFTAR LAGU TIAP RT</span>
                <span id="songCount" style="font-weight: normal; font-size: 0.9rem; color: #666;">15 Lagu</span>
            </div>
            <div class="mode-switcher">
                <button type="button" class="mode-btn active" id="modeRtBtn">🏘️ Preset: 15 Lagu RT</button>
                <button type="button" class="mode-btn" id="modeNormalBtn">🎵 Preset: Playlist Biasa</button>
            </div>
            <div class="playlist-items rt-mode" id="playlistContainer">
                <!-- Diisi oleh JavaScript -->
            </div>
            
            <!-- Input File Disembunyikan -->
            <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.opus,.wma" class="visually-hidden-file">
            <button class="add-song-btn" id="uploadBtn">+ Tambah Lagu Lain (di luar 15 RT)</button>
        </div>

        <div class="footer">
            <strong>Dirgahayu Republik Indonesia!</strong>
            Semangat Kebersamaan, Meriahkan Agustusan!
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // 15 slot RT -- KOSONG (belum ada lagu), tinggal diisi lewat ikon
        // upload di masing-masing baris (upload per-RT, lihat renderPlaylist).
        // songsRT15: preset "15 Lagu RT" -- 15 slot tetap, satu per RT.
        const songsRT15 = [
            { rt: "RT 01", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 02", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 03", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 04", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 05", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 06", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 07", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 08", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 09", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 10", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 11", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 12", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 13", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 14", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 15", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" }
        ];

        // songsNormal: preset "Playlist Biasa" -- daftar bebas, mulai kosong,
        // nambah lagu sebanyak apapun lewat tombol "+ Tambah Lagu".
        let songsNormal = [];

        let currentMode = 'rt15'; // 'rt15' | 'normal'
        let songs = songsRT15; // referensi array yang lagi aktif dipakai semua fungsi di bawah

        let pendingUploadIndex = null; // slot RT yang lagi nunggu file diupload (null = tombol umum)

        let currentSongIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let repeatMode = 'off'; // 'off' | 'all' | 'one'
        let isAutoplay = true;

        const audioPlayer = document.getElementById('audioPlayer');
        // CATATAN: sebelumnya ada `audioPlayer.crossOrigin = 'anonymous'` di sini.
        // Itu DIHAPUS karena di Safari/iPadOS, atribut crossOrigin pada <audio>
        // sering bikin file blob: (yaitu SEMUA lagu yang di-upload manual di
        // player ini) gagal dimuat/diputar sama sekali. Semua sumber lagu di
        // sini memang selalu dari upload (blob: URL, satu origin dengan
        // halaman ini), jadi crossOrigin memang tidak dibutuhkan.
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const stopBtn = document.getElementById('stopBtn');
        const autoplayBtn = document.getElementById('autoplayBtn');
        const audio8dBtn = document.getElementById('audio8dBtn');
        const downloadOriginalBtn = document.getElementById('downloadOriginalBtn');
        const downloadHQBtn = document.getElementById('downloadHQBtn');
        const hqStatus = document.getElementById('hqStatus');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const songTitle = document.getElementById('songTitle');
        const songRT = document.getElementById('songRT');
        const coverArt = document.getElementById('coverArt');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const playlistContainer = document.getElementById('playlistContainer');
        const songCount = document.getElementById('songCount');
        const playlistTitleLabel = document.getElementById('playlistTitleLabel');
        const modeRtBtn = document.getElementById('modeRtBtn');
        const modeNormalBtn = document.getElementById('modeNormalBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const userNameEl = document.getElementById('userName');

        // =========================================================
        // PENYIMPANAN PERMANEN DI PERANGKAT (IndexedDB)
        //
        // Ini BUKAN penyimpanan cloud/internet -- semua lagu (termasuk isi
        // filenya, bukan cuma nama) disimpan langsung di penyimpanan
        // browser di HP/laptop. Makanya tetap aman walau:
        //  - halaman di-refresh
        //  - browser/app ditutup paksa (force close)
        //  - wifi/internet mati total (tidak butuh internet sama sekali,
        //    karena tidak pernah dikirim ke server manapun)
        // Baru hilang kalau memang sengaja dihapus lewat tombol 🗑️, atau
        // cache/data browser dibersihkan manual oleh penggunanya.
        // =========================================================
        const DB_NAME = 'agustusanPlayerDB';
        const DB_VERSION = 1;
        const STORE_SONGS = 'songs';
        const STORE_META = 'meta';
        let dbPromise = null;

        function openDB() {
            if (dbPromise) return dbPromise;
            dbPromise = new Promise((resolve, reject) => {
                if (!window.indexedDB) { reject(new Error('IndexedDB tidak didukung di browser ini')); return; }
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(STORE_SONGS)) {
                        db.createObjectStore(STORE_SONGS, { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains(STORE_META)) {
                        db.createObjectStore(STORE_META, { keyPath: 'key' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
            return dbPromise;
        }

        async function dbPutSong(record) {
            try {
                const db = await openDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_SONGS, 'readwrite');
                    tx.objectStore(STORE_SONGS).put(record);
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            } catch (err) {
                console.error('Gagal menyimpan lagu secara permanen:', err);
            }
        }

        async function dbDeleteSong(id) {
            if (!id) return;
            try {
                const db = await openDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_SONGS, 'readwrite');
                    tx.objectStore(STORE_SONGS).delete(id);
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            } catch (err) {
                console.error('Gagal menghapus lagu dari penyimpanan permanen:', err);
            }
        }

        async function dbGetAllSongs() {
            try {
                const db = await openDB();
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_SONGS, 'readonly');
                    const req = tx.objectStore(STORE_SONGS).getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
            } catch (err) {
                console.error('Gagal memuat lagu dari penyimpanan permanen:', err);
                return [];
            }
        }

        async function dbSetMeta(key, value) {
            try {
                const db = await openDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_META, 'readwrite');
                    tx.objectStore(STORE_META).put({ key, value });
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            } catch (err) {
                console.error('Gagal menyimpan pengaturan:', err);
            }
        }

        async function dbGetMeta(key) {
            try {
                const db = await openDB();
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_META, 'readonly');
                    const req = tx.objectStore(STORE_META).get(key);
                    req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
                    req.onerror = () => reject(req.error);
                });
            } catch (err) {
                console.error('Gagal memuat pengaturan:', err);
                return undefined;
            }
        }

        // Simpan ulang metadata + file lagu tertentu ke IndexedDB. Dipakai
        // saat upload, ganti label RT, dsb. Butuh song.dbId & song._blob
        // sudah terisi (lihat fileInput change handler).
        function persistSong(song) {
            if (!song || !song.dbId || !song._blob) return;
            dbPutSong({
                id: song.dbId,
                mode: song._dbMode,
                slotIndex: (song._dbSlotIndex === undefined ? null : song._dbSlotIndex),
                order: song._dbOrder || Date.now(),
                rt: song.rt || '',
                title: song.title,
                fileName: song.fileName,
                cover: song.cover,
                blob: song._blob
            });
        }

        // Debounce kecil biar ketik label RT / nama tidak nembak IndexedDB
        // di setiap huruf yang diketik.
        function debounce(fn, wait) {
            let t = null;
            return (...args) => {
                clearTimeout(t);
                t = setTimeout(() => fn(...args), wait);
            };
        }
        const persistSongDebounced = debounce(persistSong, 400);

        // Render Playlist
        function renderPlaylist() {
            playlistContainer.classList.toggle('rt-mode', currentMode === 'rt15');
            playlistContainer.classList.toggle('normal-mode', currentMode === 'normal');
            playlistContainer.innerHTML = '';
            songCount.textContent = `${songs.length} Lagu`;

            if (currentMode === 'normal' && songs.length === 0) {
                playlistContainer.innerHTML = `<div class="playlist-empty">Belum ada lagu. Tambahkan lewat tombol "+ Tambah Lagu" di bawah ⬇️</div>`;
                return;
            }

            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.classList.add('playlist-item');
                if (index === currentSongIndex) {
                    item.classList.add('active');
                }

                if (currentMode === 'rt15') {
                    // ===== Preset 15 Lagu RT: 15 slot tetap, per-slot upload/hapus =====
                    const hasSong = !!song.src;
                    item.innerHTML = `
                        <span class="rt-label" contenteditable="true" spellcheck="false">${song.rt}</span>
                        <span class="song-name${hasSong ? '' : ' song-empty'}"><span class="song-name-track"><span class="marquee-seg">${hasSong ? song.title : 'Belum ada lagu'}</span><span class="marquee-seg" aria-hidden="true">${hasSong ? song.title : ''}</span></span></span>
                        <button type="button" class="slot-upload-btn" title="Upload lagu untuk ${song.rt}">📤</button>
                        <button type="button" class="slot-upload-btn" title="Hapus lagu ini">🗑️</button>
                    `;
                    const rtLabelEl = item.querySelector('.rt-label');
                    // Klik di label RT buat edit teks -- jangan sampai ikut memicu ganti lagu.
                    rtLabelEl.addEventListener('click', (e) => e.stopPropagation());
                    rtLabelEl.addEventListener('input', () => {
                        songs[index].rt = rtLabelEl.textContent;
                        if (index === currentSongIndex) songRT.textContent = rtLabelEl.textContent;
                        persistSongDebounced(songs[index]);
                    });
                    rtLabelEl.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') { e.preventDefault(); rtLabelEl.blur(); }
                    });
                    // Tombol upload per-slot -- isi/ganti lagu KHUSUS baris RT ini,
                    // tidak nambah baris baru.
                    const slotUploadBtn = item.querySelector('.slot-upload-btn');
                    slotUploadBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        pendingUploadIndex = index;
                        fileInput.click();
                    });
                    // Tombol hapus -- slot RT tetap (di-reset kosong), lagu tambahan
                    // di luar 15 RT (rt==="UPLOAD") langsung dibuang dari daftar.
                    const deleteBtn = item.querySelectorAll('.slot-upload-btn')[1];
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (song.src) URL.revokeObjectURL(song.src);
                        dbDeleteSong(song.dbId);
                        if (song.rt === 'UPLOAD') {
                            songs.splice(index, 1);
                            if (currentSongIndex >= songs.length) currentSongIndex = Math.max(0, songs.length - 1);
                            else if (index < currentSongIndex) currentSongIndex--;
                        } else {
                            songs[index].title = null;
                            songs[index].src = null;
                            songs[index].cover = "DIRGAHAYU<br>INDONESIA";
                            songs[index].dbId = `rt15-${index}`;
                            songs[index].fileName = null;
                            songs[index]._blob = null;
                        }
                        if (index === currentSongIndex || songs[currentSongIndex] === undefined) {
                            loadSong(Math.min(currentSongIndex, Math.max(0, songs.length - 1)));
                        } else {
                            renderPlaylist();
                        }
                    });
                } else {
                    // ===== Preset Playlist Biasa: daftar dinamis, tanpa label RT =====
                    item.innerHTML = `
                        <span class="track-number">${index + 1}.</span>
                        <span class="song-name"><span class="song-name-track"><span class="marquee-seg">${song.title}</span><span class="marquee-seg" aria-hidden="true">${song.title}</span></span></span>
                        <button type="button" class="slot-upload-btn" title="Hapus lagu ini">🗑️</button>
                    `;
                    const deleteBtn = item.querySelector('.slot-upload-btn');
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (song.src) URL.revokeObjectURL(song.src);
                        dbDeleteSong(song.dbId);
                        songs.splice(index, 1);
                        if (songs.length === 0) {
                            showEmptyPlayerState();
                            return;
                        }
                        if (currentSongIndex >= songs.length) currentSongIndex = songs.length - 1;
                        else if (index < currentSongIndex) currentSongIndex--;
                        if (index === currentSongIndex || songs[currentSongIndex] === undefined) {
                            loadSong(Math.min(currentSongIndex, songs.length - 1));
                        } else {
                            renderPlaylist();
                        }
                    });
                }

                item.addEventListener('click', () => {
                    // Klik lagu di daftar cuma MEMUAT/memilih lagunya --
                    // tidak langsung diputar otomatis, walau tadinya lagu
                    // lain lagi diputar. User yang harus tekan tombol ▶️
                    // sendiri kalau memang mau memutar lagu itu.
                    loadSong(index);
                });
                playlistContainer.appendChild(item);
            });

            activateMarquees();
        }

        // Aktifkan animasi marquee HANYA untuk judul yang benar-benar
        // kepanjangan (melebihi lebar kotaknya) -- judul pendek dibiarkan
        // diam, tidak ikut-ikutan bergerak. Ukurannya di-cek setelah
        // elemen benar-benar ada di DOM (pakai requestAnimationFrame
        // supaya browser sudah selesai layout dulu).
        function activateMarquees() {
            requestAnimationFrame(() => {
                playlistContainer.querySelectorAll('.song-name').forEach((nameEl) => {
                    const track = nameEl.querySelector('.song-name-track');
                    const firstSeg = nameEl.querySelector('.marquee-seg');
                    if (!track || !firstSeg) return;
                    const singleWidth = firstSeg.offsetWidth;
                    const boxWidth = nameEl.clientWidth;
                    nameEl.classList.remove('marquee-active');
                    track.style.removeProperty('animation-duration');
                    if (singleWidth > boxWidth + 2) {
                        // Kecepatan tetap (~35px/detik) supaya judul panjang
                        // tidak terasa buru-buru dibanding judul yang lebih pendek.
                        const duration = Math.max(4, singleWidth / 35);
                        track.style.animationDuration = `${duration}s`;
                        nameEl.classList.add('marquee-active');
                    }
                });
            });
        }

        // Tampilan pemutar saat playlist aktif kosong sama sekali
        // (cuma bisa kejadian di preset Playlist Biasa, karena preset 15 RT
        // selalu punya 15 slot walau isinya kosong).
        function showEmptyPlayerState() {
            pauseSong();
            currentSongIndex = 0;
            songTitle.textContent = 'Belum ada lagu';
            songRT.textContent = '';
            coverArt.innerHTML = 'PLAYLIST<br>KOSONG';
            audioPlayer.removeAttribute('src');
            audioPlayer.load();
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '00:00';
            durationTimeEl.textContent = '00:00';
            renderPlaylist();
        }

        // Pindah preset: 15 Lagu RT <-> Playlist Biasa.
        // Playback dihentikan dulu biar tidak ada lagu preset lama yang
        // kepancing lanjut muter pas sudah pindah ke preset lain.
        function switchMode(mode) {
            if (mode === currentMode) return;
            pauseSong();
            currentMode = mode;
            songs = (mode === 'rt15') ? songsRT15 : songsNormal;
            pendingUploadIndex = null;
            dbSetMeta('currentMode', mode);

            modeRtBtn.classList.toggle('active', mode === 'rt15');
            modeNormalBtn.classList.toggle('active', mode === 'normal');
            playlistTitleLabel.textContent = (mode === 'rt15') ? 'DAFTAR LAGU TIAP RT' : 'DAFTAR LAGU';
            uploadBtn.textContent = (mode === 'rt15') ? '+ Tambah Lagu Lain (di luar 15 RT)' : '+ Tambah Lagu';

            if (songs.length > 0) {
                loadSong(0);
            } else {
                showEmptyPlayerState();
            }
        }
        modeRtBtn.addEventListener('click', () => switchMode('rt15'));
        modeNormalBtn.addEventListener('click', () => switchMode('normal'));

        // Load Song (Hanya memuat, TIDAK langsung play)
        function loadSong(index) {
            if (!songs[index]) {
                showEmptyPlayerState();
                return;
            }
            currentSongIndex = index;
            const song = songs[index];
            songTitle.textContent = song.src ? song.title : 'Belum ada lagu';
            songRT.textContent = song.rt || '';
            coverArt.innerHTML = song.cover;
            if (song.src) {
                audioPlayer.src = song.src;
            } else {
                audioPlayer.removeAttribute('src');
                audioPlayer.load();
            }

            // Hentikan status "playing" & elemen <audio>-nya, TAPI JANGAN
            // suspend AudioContext di sini. Nge-suspend AudioContext tepat
            // pas src lagu diganti (lalu resume lagi sepersekian detik
            // kemudian untuk lanjut ke lagu berikutnya) adalah biang bug
            // "suara hilang pas ganti lagu / pas autoplay" di beberapa
            // browser (terutama Safari/iPad) -- AudioContext dan
            // MediaElementSource-nya jadi telat "connect" ulang.
            // AudioContext HANYA kita suspend saat user benar-benar
            // menekan tombol PAUSE manual (lihat pauseSong()).
            isPlaying = false;
            playPauseBtn.innerHTML = '▶️';
            audioPlayer.pause();

            progressFill.style.width = '0%';
            currentTimeEl.textContent = '00:00';
            durationTimeEl.textContent = '00:00';
            
            renderPlaylist();
        }

        function playSong() {
            const song = songs[currentSongIndex];
            if (!song.src) {
                // Slot ini belum diisi lagu -- diam saja, jangan coba muter apa-apa.
                isPlaying = false;
                playPauseBtn.innerHTML = '▶️';
                return;
            }
            ensureAudioGraph();
            isPlaying = true;
            playPauseBtn.innerHTML = '⏸️';
            // Pastikan rangkaian Web Audio-nya sudah benar-benar aktif
            // (resume) SEBELUM elemen audio-nya diputar -- kalau kebalik
            // urutannya, sepersekian detik pertama bisa diam/glitch karena
            // context-nya belum siap menerima suara.
            const resumeThenPlay = () => audioPlayer.play();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(resumeThenPlay).catch(resumeThenPlay);
            } else {
                resumeThenPlay();
            }
        }

        function pauseSong() {
            isPlaying = false;
            playPauseBtn.innerHTML = '▶️';
            audioPlayer.pause();
            // Ikut hentikan rangkaian Web Audio-nya (bukan cuma elemen
            // <audio>-nya) -- kalau tidak, rangkaian filter/compressor
            // tetap "hidup" di belakang layar dan suka nyisain sepotong
            // buffer terakhir yang terdengar seperti "ngulang" pas nanti
            // ditekan play lagi.
            if (audioCtx && audioCtx.state === 'running') {
                audioCtx.suspend();
            }
        }

        // Stop/Reset -- beda dari pause: selain berhenti, posisi lagu
        // dibalikin ke 00:00. TIDAK otomatis main lagi -- harus ditekan
        // tombol ▶️ sendiri kalau mau lanjut dari awal.
        function stopSong() {
            pauseSong();
            if (audioPlayer.src) {
                audioPlayer.currentTime = 0;
            }
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '00:00';
        }
        stopBtn.addEventListener('click', stopSong);

        // Ambil index acak yang beda dari index sekarang (kalau lagu > 1)
        function getRandomIndex(exclude) {
            if (songs.length <= 1) return 0;
            let idx;
            do { idx = Math.floor(Math.random() * songs.length); } while (idx === exclude);
            return idx;
        }

        function prevSong() {
            const wasPlaying = isPlaying;
            currentSongIndex = isShuffle
                ? getRandomIndex(currentSongIndex)
                : (currentSongIndex - 1 + songs.length) % songs.length;
            loadSong(currentSongIndex);
            if (wasPlaying) playSong();
        }

        function nextSong() {
            const wasPlaying = isPlaying;
            currentSongIndex = isShuffle
                ? getRandomIndex(currentSongIndex)
                : (currentSongIndex + 1) % songs.length;
            loadSong(currentSongIndex);
            if (wasPlaying) playSong();
        }

        // Dipanggil saat lagu selesai sendiri (bukan diklik manual) --
        // di sinilah mode "Ulang" (repeat) dan "Autoplay" benar-benar berlaku.
        function handleSongEnd() {
            if (!isAutoplay) {
                // Autoplay dimatikan -- berhenti total, jangan lanjut ke lagu apa pun.
                pauseSong();
                audioPlayer.currentTime = 0;
                progressFill.style.width = '0%';
                currentTimeEl.textContent = '00:00';
                return;
            }
            if (repeatMode === 'one') {
                audioPlayer.currentTime = 0;
                playSong();
                return;
            }
            // Repeat mati & bukan shuffle & sudah di lagu terakhir -> berhenti,
            // jangan lompat balik ke lagu pertama sendiri.
            if (repeatMode === 'off' && !isShuffle && currentSongIndex === songs.length - 1) {
                pauseSong();
                audioPlayer.currentTime = 0;
                progressFill.style.width = '0%';
                currentTimeEl.textContent = '00:00';
                return;
            }
            nextSong();
        }

        function updateProgress(e) {
            const { duration, currentTime } = e.srcElement;
            if (duration) {
                const progressPercent = (currentTime / duration) * 100;
                progressFill.style.width = `${progressPercent}%`;
                currentTimeEl.textContent = formatTime(currentTime);
                durationTimeEl.textContent = formatTime(duration);
            }
        }

        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            const duration = audioPlayer.duration;
            if (duration) audioPlayer.currentTime = (clickX / width) * duration;
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Event Listeners
        playPauseBtn.addEventListener('click', () => isPlaying ? pauseSong() : playSong());
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('ended', handleSongEnd);
        progressBar.addEventListener('click', setProgress);

        // Shuffle
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
            shuffleBtn.title = isShuffle ? 'Acak: Aktif' : 'Acak: Mati';
        });

        // Repeat -- siklus: mati -> ulang semua -> ulang 1 lagu -> mati
        const repeatIcons = { off: '🔁', all: '🔁', one: '🔂' };
        const repeatTitles = { off: 'Ulang: Mati', all: 'Ulang: Semua Lagu', one: 'Ulang: Lagu Ini' };
        repeatBtn.addEventListener('click', () => {
            repeatMode = repeatMode === 'off' ? 'all' : (repeatMode === 'all' ? 'one' : 'off');
            repeatBtn.innerHTML = repeatIcons[repeatMode];
            repeatBtn.title = repeatTitles[repeatMode];
            repeatBtn.classList.toggle('active', repeatMode !== 'off');
        });

        // Volume
        volumeSlider.addEventListener('input', () => {
            const vol = volumeSlider.value / 100;
            audioPlayer.volume = vol;
            volumeIcon.textContent = vol == 0 ? '🔇' : (vol < 0.5 ? '🔉' : '🔊');
        });
        audioPlayer.volume = volumeSlider.value / 100;

        // Fullscreen (dengan fallback vendor prefix buat browser/HP lama)
        fullscreenBtn.addEventListener('click', () => {
            const el = document.querySelector('.container');
            const isFs = document.fullscreenElement || document.webkitFullscreenElement;
            if (!isFs) {
                const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                if (req) req.call(el);
            } else {
                const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                if (exit) exit.call(document);
            }
        });
        function syncFullscreenBtn() {
            const isFs = document.fullscreenElement || document.webkitFullscreenElement;
            fullscreenBtn.textContent = isFs ? '⤢' : '⛶';
            fullscreenBtn.title = isFs ? 'Keluar Layar Penuh' : 'Layar Penuh';
        }
        document.addEventListener('fullscreenchange', syncFullscreenBtn);
        document.addEventListener('webkitfullscreenchange', syncFullscreenBtn);

        // Jaga-jaga khusus iPad/HP: kalau layar dikunci atau aplikasi
        // dipindah ke background lalu dibuka lagi, sistemnya kadang
        // men-suspend AudioContext sendiri (irit baterai). Begitu app
        // aktif lagi, kalau tadinya memang lagi diputar, bangunkan lagi
        // context-nya -- biar suara tidak hilang atau nge-glitch.
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isPlaying && audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
        });

        // Autoplay -- kalau dimatikan, lagu berhenti total begitu selesai
        // (lihat handleSongEnd), tidak lompat ke lagu berikutnya sendiri.
        autoplayBtn.addEventListener('click', () => {
            isAutoplay = !isAutoplay;
            autoplayBtn.classList.toggle('active', isAutoplay);
            autoplayBtn.title = isAutoplay
                ? 'Lanjut otomatis ke lagu berikutnya: Aktif'
                : 'Lanjut otomatis ke lagu berikutnya: Mati';
        });

        // Graph Web Audio -- dipakai untuk DUA hal sekaligus:
        //  1) Penjernih audio yang SELALU aktif otomatis (highshelf + compressor)
        //  2) Efek 8D (panning stereo berputar) lewat tombol 8D, opsional
        // Graph-nya cuma dibuat SEKALI (createMediaElementSource cuma boleh
        // dipanggil sekali per elemen <audio>) -- dipicu otomatis pas lagu
        // pertama kali diputar (lihat playSong()).
        // CATATAN: butuh audio yang sama-origin (upload dari storage = aman)
        // atau server sumbernya izinkan CORS -- kalau tidak, browser akan
        // membisukan audio begitu masuk Web Audio API (bukan bug di sini).
        let audioCtx = null, sourceNode = null, pannerNode = null;
        let is8D = false, panStartTime = 0, panRafId = null;

        // =========================================================
        // RANGKAIAN PENJERNIH & PENGUAT KUALITAS ("mastering chain")
        //
        // Dipakai OTOMATIS untuk SEMUA lagu, di KEDUA preset (15 Lagu RT
        // maupun Playlist Biasa) -- karena nempel ke satu elemen <audio>
        // yang dipakai bersama oleh kedua preset itu, bukan per-lagu.
        // Fungsi yang SAMA PERSIS ini juga dipakai saat tombol "Unduh HQ
        // WAV" dipakai, jadi hasil unduhan = persis apa yang kedengaran
        // pas lagu diputar di sini.
        //
        // CATATAN JUJUR: tidak ada proses digital yang bisa menciptakan
        // detail suara yang memang tidak ada di file aslinya (mustahil
        // secara fisik). Yang dilakukan di sini adalah membentuk ulang
        // frekuensi (EQ 3-band) + meratakan & mengamankan volume dengan
        // SATU node dynamics (bukan dua bersusun) -- supaya secara
        // PERSEPSI lagu kedengaran lebih penuh & jernih, tanpa sampai
        // pecah/distorsi, dan tanpa numpuk "lookahead buffer" dua
        // compressor sekaligus yang dulu jadi biang glitch pas pause/play.
        // =========================================================
        function buildEnhancerChain(ctx) {
            // 1) Bass -- sedikit lebih penuh/hangat
            const bassNode = ctx.createBiquadFilter();
            bassNode.type = 'lowshelf';
            bassNode.frequency.value = 150;
            bassNode.gain.value = 3.5;

            // 2) Presence -- vokal & instrumen depan terasa lebih dekat/jelas
            const presenceNode = ctx.createBiquadFilter();
            presenceNode.type = 'peaking';
            presenceNode.frequency.value = 3000;
            presenceNode.Q.value = 1;
            presenceNode.gain.value = 2.5;

            // 3) Treble -- detail/kilau (hi-hat, cymbal, konsonan vokal)
            const clarityNode = ctx.createBiquadFilter();
            clarityNode.type = 'highshelf';
            clarityNode.frequency.value = 9000;
            clarityNode.gain.value = 3.5;

            // 4) SATU node dynamics yang merangkap tugas "compressor" (ratakan
            //    volume) SEKALIGUS "limiter" (cegah pecah/clipping) -- threshold
            //    lebih rendah + ratio lebih tinggi dari compressor biasa, jadi
            //    tetap aman menahan boost EQ di atas tanpa perlu node kedua.
            const dynamicsNode = ctx.createDynamicsCompressor();
            dynamicsNode.threshold.value = -18;
            dynamicsNode.knee.value = 16;
            dynamicsNode.ratio.value = 6;
            dynamicsNode.attack.value = 0.006;
            dynamicsNode.release.value = 0.25;

            // 5) Gain make-up -- imbangi volume yang turun akibat dynamicsNode
            const makeupGain = ctx.createGain();
            makeupGain.gain.value = 1.1;

            bassNode.connect(presenceNode)
                .connect(clarityNode)
                .connect(dynamicsNode)
                .connect(makeupGain);

            return { input: bassNode, output: makeupGain };
        }

        function ensureAudioGraph() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioCtx.createMediaElementSource(audioPlayer);
            pannerNode = audioCtx.createStereoPanner();

            const enhancer = buildEnhancerChain(audioCtx);
            sourceNode.connect(pannerNode).connect(enhancer.input);
            enhancer.output.connect(audioCtx.destination);
        }

        function run8DPanLoop() {
            if (!is8D) return;
            const elapsed = audioCtx.currentTime - panStartTime;
            pannerNode.pan.value = Math.sin(elapsed * 0.6); // ~10 detik per putaran kiri-kanan
            panRafId = requestAnimationFrame(run8DPanLoop);
        }

        audio8dBtn.addEventListener('click', () => {
            ensureAudioGraph();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            is8D = !is8D;
            audio8dBtn.classList.toggle('active', is8D);
            audio8dBtn.title = is8D ? 'Efek 8D Audio: Aktif' : 'Efek 8D Audio: Mati';
            if (is8D) {
                panStartTime = audioCtx.currentTime;
                run8DPanLoop();
            } else {
                if (panRafId) cancelAnimationFrame(panRafId);
                pannerNode.pan.value = 0;
            }
        });

        // =========================================================
        // RENDER & UNDUH WAV KUALITAS MAKSIMAL (offline, bisa diputar
        // tanpa internet setelah didownload)
        //
        // CATATAN JUJUR soal "kbps/khz maksimal":
        // Ini TIDAK menciptakan detail suara baru yang tidak ada di file
        // aslinya -- kualitas fisik audio tidak bisa melebihi sumbernya.
        // Yang dilakukan di sini:
        //  1) Lagu dirender ulang lewat OfflineAudioContext, melewati
        //     filter penjernih yang sama dengan yang otomatis aktif saat
        //     diputar (highshelf + compressor) -- jadi efek jernihnya
        //     "terbakar" ke dalam file, bukan cuma efek sementara pas
        //     diputar di browser ini.
        //  2) Hasilnya disimpan sebagai WAV PCM (lossless, TANPA kompresi
        //     seperti MP3), memakai sample rate & jumlah channel asli
        //     file sumbernya -- jadi ini kualitas MAKSIMAL yang mungkin
        //     didapat dari sumbernya, tanpa kehilangan data akibat
        //     kompresi ulang.
        // =========================================================
        // Unduh file lagu APA ADANYA, tanpa diproses sama sekali.
        // Ini pilihan paling ringan & paling aman -- tidak perlu decode audio
        // ke memori, jadi tidak ada risiko gagal karena file panjang/besar
        // (misalnya lagu DJ/mixtape berdurasi puluhan menit - jam).
        function downloadOriginalFile(songOverride) {
            const song = songOverride || songs[currentSongIndex];
            if (!song || !song.src) {
                alert('Belum ada lagu di slot ini untuk diunduh.');
                return;
            }
            const a = document.createElement('a');
            a.href = song.src;
            a.download = song.fileName || `${song.title || 'lagu'}.mp3`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
        downloadOriginalBtn.addEventListener('click', () => downloadOriginalFile());

        async function renderAndDownloadWav(songOverride) {
            const song = songOverride || songs[currentSongIndex];
            if (!song || !song.src) {
                alert('Belum ada lagu di slot ini untuk dirender.');
                return;
            }

            downloadHQBtn.disabled = true;
            downloadHQBtn.textContent = '⏳ Merender...';
            hqStatus.style.display = 'block';
            hqStatus.textContent = `Mengambil & mendekode "${song.title}"...`;

            try {
                const resp = await fetch(song.src);
                const arrayBuffer = await resp.arrayBuffer();

                const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                const decoded = await tempCtx.decodeAudioData(arrayBuffer.slice(0));
                tempCtx.close();

                hqStatus.textContent = `Merender lewat filter penjernih (${decoded.sampleRate} Hz, ${decoded.numberOfChannels === 2 ? 'stereo' : 'mono'})...`;

                const offlineCtx = new OfflineAudioContext(
                    decoded.numberOfChannels,
                    decoded.length,
                    decoded.sampleRate // pakai sample rate ASLI -- tidak upsampling palsu
                );

                const src = offlineCtx.createBufferSource();
                src.buffer = decoded;

                // Sama persis dengan graph "always-on" saat diputar live
                const enhancer = buildEnhancerChain(offlineCtx);
                src.connect(enhancer.input);
                enhancer.output.connect(offlineCtx.destination);
                src.start(0);

                const rendered = await offlineCtx.startRendering();

                hqStatus.textContent = 'Membungkus jadi file WAV...';
                const wavBlob = audioBufferToWav(rendered);

                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a');
                a.href = url;
                const safeName = (song.title || 'lagu').replace(/[\\/:*?"<>|]/g, '_');
                a.download = `${safeName} (HQ ${decoded.sampleRate}Hz).wav`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 15000);

                hqStatus.textContent = `Selesai! Diunduh sebagai WAV ${decoded.sampleRate} Hz, siap diputar offline.`;
                setTimeout(() => { hqStatus.style.display = 'none'; }, 5000);
            } catch (err) {
                console.error(err);
                hqStatus.textContent = '';
                hqStatus.style.display = 'none';
                alert(
                    'Gagal merender jadi WAV.\n\n' +
                    'Alasan teknis: ' + (err && err.message ? err.message : err) + '\n\n' +
                    'Ini sering terjadi kalau lagunya sangat panjang (mixtape/DJ set puluhan menit-berjam-jam) ' +
                    'karena harus dimuat penuh ke memori perangkat. Untuk lagu seperti itu, gunakan tombol ' +
                    '"⬇️ Unduh Asli" saja -- hasilnya tetap kualitas penuh tanpa risiko gagal.'
                );
            } finally {
                downloadHQBtn.disabled = false;
                downloadHQBtn.textContent = '⬇️ Unduh HQ WAV';
            }
        }

        // Ubah AudioBuffer hasil render jadi file WAV PCM 16-bit (lossless)
        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const bitDepth = 16;

            const channelData = [];
            for (let ch = 0; ch < numChannels; ch++) {
                channelData.push(buffer.getChannelData(ch));
            }

            const interleaved = numChannels === 2
                ? interleaveStereo(channelData[0], channelData[1])
                : channelData[0];

            const bytesPerSample = bitDepth / 8;
            const dataLength = interleaved.length * bytesPerSample;
            const bufferArr = new ArrayBuffer(44 + dataLength);
            const view = new DataView(bufferArr);

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);           // ukuran chunk fmt
            view.setUint16(20, 1, true);             // format = PCM
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * bytesPerSample, true); // byte rate
            view.setUint16(32, numChannels * bytesPerSample, true);              // block align
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataLength, true);

            floatTo16BitPCM(view, 44, interleaved);

            return new Blob([view], { type: 'audio/wav' });
        }

        function interleaveStereo(left, right) {
            const length = left.length + right.length;
            const result = new Float32Array(length);
            let index = 0, inputIndex = 0;
            while (index < length) {
                result[index++] = left[inputIndex];
                result[index++] = right[inputIndex];
                inputIndex++;
            }
            return result;
        }

        function floatTo16BitPCM(view, offset, input) {
            for (let i = 0; i < input.length; i++, offset += 2) {
                const s = Math.max(-1, Math.min(1, input[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
        }

        downloadHQBtn.addEventListener('click', renderAndDownloadWav);

        // Tombol umum -- tambah lagu BARU di luar 15 slot RT (bukan isi slot RT)
        uploadBtn.addEventListener('click', () => { pendingUploadIndex = null; fileInput.click(); });
        
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const songUrl = URL.createObjectURL(file);
                const songName = file.name.replace(/\.[^/.]+$/, ""); // Hapus ekstensi .mp3 dll

                if (pendingUploadIndex !== null) {
                    // Isi/ganti lagu KHUSUS slot RT yang tombol upload-nya diklik
                    const idx = pendingUploadIndex;
                    songs[idx].title = songName;
                    songs[idx].src = songUrl;
                    songs[idx].fileName = file.name; // nama asli + ekstensi, dipakai saat "Unduh Asli"
                    songs[idx].cover = "LAGU<br>UPLOAD";
                    songs[idx].dbId = `rt15-${idx}`;
                    songs[idx]._blob = file;
                    songs[idx]._dbMode = 'rt15';
                    songs[idx]._dbSlotIndex = idx;
                    persistSong(songs[idx]);
                    pendingUploadIndex = null;
                    if (idx === currentSongIndex) {
                        loadSong(idx); // refresh tampilan pemutar kalau slot ini lagi aktif
                    } else {
                        renderPlaylist();
                    }
                } else {
                    // Tombol umum -- tambah baris baru di akhir daftar
                    const order = Date.now();
                    const newSong = {
                        rt: currentMode === 'rt15' ? "UPLOAD" : "",
                        title: songName,
                        src: songUrl,
                        fileName: file.name, // nama asli + ekstensi, dipakai saat "Unduh Asli"
                        cover: currentMode === 'rt15' ? "LAGU<br>UPLOAD" : "PLAYLIST<br>LAGU",
                        dbId: `${currentMode}-extra-${order}-${Math.random().toString(36).slice(2, 8)}`,
                        _blob: file,
                        _dbMode: currentMode,
                        _dbSlotIndex: null,
                        _dbOrder: order
                    };
                    songs.push(newSong);
                    persistSong(newSong);
                    renderPlaylist();
                    loadSong(songs.length - 1);
                }

                // Reset input agar bisa upload file dengan nama yang sama lagi
                fileInput.value = '';
            }
        });

        // Simpan nama pengguna juga -- kecil, tapi ikut dikembalikan lagi
        // setelah refresh/force-close biar tidak perlu ketik ulang.
        userNameEl.addEventListener('input', debounce(() => {
            dbSetMeta('userName', userNameEl.textContent);
        }, 400));

        // =========================================================
        // PEMULIHAN OTOMATIS SAAT HALAMAN DIBUKA
        //
        // Baca semua lagu (isi file + label RT + urutan) dan pengaturan
        // terakhir (nama, preset aktif) dari IndexedDB, lalu susun ulang
        // playlist persis seperti sebelum halaman ditutup/refresh --
        // semua dari penyimpanan LOKAL, tidak butuh internet sama sekali.
        // =========================================================
        async function restoreFromDB() {
            const records = await dbGetAllSongs();

            const extrasRT15 = [];
            const normalList = [];

            for (const rec of records) {
                const songObj = {
                    rt: rec.rt || '',
                    title: rec.title,
                    src: rec.blob ? URL.createObjectURL(rec.blob) : null,
                    fileName: rec.fileName,
                    cover: rec.cover,
                    dbId: rec.id,
                    _blob: rec.blob || null,
                    _dbMode: rec.mode,
                    _dbSlotIndex: (rec.slotIndex === undefined ? null : rec.slotIndex),
                    _dbOrder: rec.order || 0
                };

                if (rec.mode === 'rt15' && rec.slotIndex !== null && rec.slotIndex !== undefined
                    && rec.slotIndex >= 0 && rec.slotIndex < songsRT15.length) {
                    songsRT15[rec.slotIndex] = songObj;
                } else if (rec.mode === 'rt15') {
                    extrasRT15.push(songObj);
                } else if (rec.mode === 'normal') {
                    normalList.push(songObj);
                }
            }

            extrasRT15.sort((a, b) => a._dbOrder - b._dbOrder);
            normalList.sort((a, b) => a._dbOrder - b._dbOrder);
            songsRT15.push(...extrasRT15);
            songsNormal = normalList;

            const savedName = await dbGetMeta('userName');
            if (savedName) userNameEl.textContent = savedName;

            const savedMode = await dbGetMeta('currentMode');
            if (savedMode === 'normal') {
                currentMode = 'normal';
                modeRtBtn.classList.remove('active');
                modeNormalBtn.classList.add('active');
                playlistTitleLabel.textContent = 'DAFTAR LAGU';
                uploadBtn.textContent = '+ Tambah Lagu';
            }
            songs = (currentMode === 'rt15') ? songsRT15 : songsNormal;

            if (songs.length > 0) {
                loadSong(0);
            } else {
                showEmptyPlayerState();
            }
        }

        // Initial Load -- coba pulihkan dari penyimpanan permanen dulu;
        // kalau gagal/kosong, tampilkan 15 slot RT kosong seperti biasa.
        restoreFromDB().catch((err) => {
            console.error('Gagal memulihkan playlist tersimpan:', err);
            loadSong(0);
        });
    </script>
</body>
</html>
