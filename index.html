<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agustusan Pemutar Lagu</title>
    <style>
        :root {
            --primary-red: #E10000;
            --dark-red: #B30000;
            --white: #FFFFFF;
            --bg-color: #F5F5F5;
            --text-dark: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--white);
            width: 100%;
            max-width: 1000px; /* Lebar maksimal untuk layar besar */
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Tampilan saat fullscreen -- isi layar penuh, tanpa sudut membulat */
        .container:fullscreen,
        .container:-webkit-full-screen {
            max-width: 100%;
            width: 100%;
            height: 100%;
            border-radius: 0;
            justify-content: center;
            background-color: var(--white);
            /* PENTING: harus bisa di-scroll sendiri di dalam sini.
               Kalau overflow-nya "hidden" (warisan dari .container biasa)
               dan konten (playlist dll) lebih tinggi dari layar, jari yang
               geser ke atas/bawah tidak nge-scroll apa-apa -- gerakannya
               malah "bocor" ke browser/OS dan ditangkap sebagai gestur
               keluar dari fullscreen. Dengan overflow-y:auto, geseran akan
               dipakai untuk scroll konten dulu, jadi fullscreen tidak
               tertutup sendiri. */
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            /* Kunci arah geseran ke vertikal saja -- supaya geseran ke
               kiri/kanan (yang sering ditangkap browser/OS sebagai gestur
               "back" atau keluar fullscreen) tidak diteruskan ke luar. */
            touch-action: pan-y;
        }

        .header {
            background: var(--primary-red);
            color: var(--white);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 3px solid var(--dark-red);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-profile span {
            cursor: text;
            outline: none;
            font-weight: bold;
            min-width: 50px;
            display: inline-block;
        }

        .fullscreen-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: var(--white);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .fullscreen-btn:hover {
            background: rgba(255,255,255,0.35);
        }

        /* Layout Pemutar di Atas Tengah */
        .player-section {
            padding: 30px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 40px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }

        .cover-art {
            width: 150px;
            height: 150px;
            background: var(--primary-red);
            border-radius: 10px;
            overflow: hidden;
            border: 4px solid var(--white);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--white);
            font-weight: bold;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.4;
            flex-shrink: 0;
        }

        .player-details {
            flex: 1;
            max-width: 500px;
            min-width: 0; /* penting: biar flex item boleh menyusut, kalau
                             tidak, judul panjang tanpa spasi akan memaksa
                             lebar keluar (numpuk ke samping / bikin scroll
                             horizontal) daripada turun ke baris baru */
        }

        .song-title {
            margin: 0;
            font-size: 1.4rem; /* sedikit lebih kecil dari sebelumnya (1.8rem) */
            color: var(--text-dark);
            overflow-wrap: break-word;
            word-break: break-word;
            line-height: 1.3;
        }

        .song-rt {
            color: #777;
            font-size: 1rem;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #ddd;
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-red);
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #666;
            margin-top: 8px;
        }

        .controls {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        .btn-control {
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }

        .btn-control:hover {
            transform: scale(1.15);
            color: var(--primary-red);
        }

        .btn-play {
            font-size: 3rem;
            color: var(--primary-red);
        }

        /* Tombol shuffle & repeat -- lebih kecil dari tombol utama, ada state aktif */
        .btn-toggle {
            font-size: 1.2rem;
            opacity: 0.45;
        }

        .btn-toggle.active {
            opacity: 1;
            color: var(--primary-red);
        }

        /* Volume */
        .extra-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .pill-btn {
            border: 1.5px solid #ddd;
            background: var(--white);
            color: #888;
            font-size: 0.72rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .pill-btn:hover {
            border-color: var(--primary-red);
            color: var(--primary-red);
        }

        .pill-btn.active {
            background: var(--primary-red);
            border-color: var(--primary-red);
            color: var(--white);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-container span {
            font-size: 1.1rem;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .volume-container input[type="range"] {
            flex: 1;
            max-width: 160px;
            accent-color: var(--primary-red);
            cursor: pointer;
        }

        /* Layout Playlist di Bawah */
        .playlist-section {
            padding: 20px 30px 30px;
            background: var(--white);
        }

        .playlist-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--text-dark);
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-items {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Membagi menjadi 3 kolom */
            gap: 10px;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            background: #f9f9f9;
            border: 1px solid #eee;
        }

        .playlist-item:hover {
            background-color: #ffe5e5;
            border-color: var(--primary-red);
        }

        .playlist-item.active {
            background-color: var(--primary-red);
            color: var(--white);
            border-color: var(--dark-red);
        }

        .playlist-item .rt-label {
            font-weight: bold;
            font-size: 0.9rem;
            min-width: 50px;
        }

        .playlist-item .rt-label[contenteditable="true"] {
            cursor: text;
            outline: none;
            border-bottom: 1px dashed transparent;
        }

        .playlist-item .rt-label[contenteditable="true"]:hover,
        .playlist-item .rt-label[contenteditable="true"]:focus {
            border-bottom-color: currentColor;
        }

        .playlist-item .song-name {
            font-size: 0.9rem;
            text-align: right;
            flex: 1;
            margin-left: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item .song-name.song-empty {
            font-style: italic;
            opacity: 0.55;
        }

        .slot-upload-btn {
            background: none;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 8px;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.2s;
        }

        .slot-upload-btn:hover {
            opacity: 1;
            transform: scale(1.15);
        }

        .add-song-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: var(--white);
            border: 2px dashed #ccc;
            color: #666;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-song-btn:hover {
            border-color: var(--primary-red);
            color: var(--primary-red);
            background: #fff5f5;
        }

        .footer {
            background-color: #f0f0f0;
            padding: 15px 25px;
            text-align: center;
            font-size: 0.85rem;
            color: #555;
            border-top: 1px solid #ddd;
        }

        .footer strong {
            color: var(--primary-red);
            display: block;
            margin-bottom: 4px;
            font-size: 1rem;
        }

        /* input file disembunyikan SECARA VISUAL (bukan display:none) --
           Safari iOS/iPadOS kadang menolak membuka jendela pilih file kalau
           inputnya display:none, walau ditrigger lewat tombol. */
        .visually-hidden-file {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border: 0;
        }

        audio {
            display: none;
        }

        /* Responsif untuk layar kecil (Tablet/HP) */
        @media (max-width: 768px) {
            .player-section {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            .controls {
                justify-content: center;
            }
            .volume-container {
                justify-content: center;
            }
            .playlist-items {
                grid-template-columns: repeat(2, 1fr); /* 2 kolom di tablet */
            }
        }
        @media (max-width: 480px) {
            .playlist-items {
                grid-template-columns: 1fr; /* 1 kolom di HP */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-title">
                <span>🔊 AGUSTUSAN PEMUTAR LAGU</span>
            </div>
            <div class="header-right">
                <div class="user-profile">
                    Nama: <span contenteditable="true" id="userName">Tamu</span>
                </div>
                <button class="fullscreen-btn" id="fullscreenBtn" title="Layar Penuh">⛶</button>
            </div>
        </div>

        <!-- Pemutar Lagu (Atas Tengah) -->
        <div class="player-section">
            <div class="cover-art" id="coverArt">
                DIRGAHAYU<br>INDONESIA
            </div>
            <div class="player-details">
                <h2 class="song-title" id="songTitle">Indonesia Pusaka</h2>
                <p class="song-rt" id="songRT">RT 01</p>

                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">00:00</span>
                        <span id="durationTime">00:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn-control btn-toggle" id="shuffleBtn" title="Acak">🔀</button>
                    <button class="btn-control" id="prevBtn">⏮</button>
                    <button class="btn-control btn-play" id="playPauseBtn">▶️</button>
                    <button class="btn-control" id="nextBtn">⏭</button>
                    <button class="btn-control btn-toggle" id="repeatBtn" title="Ulang: Mati">🔁</button>
                </div>

                <div class="extra-controls">
                    <button class="pill-btn active" id="autoplayBtn" title="Lanjut otomatis ke lagu berikutnya: Aktif">AUTO</button>
                    <div class="volume-container">
                        <span id="volumeIcon">🔊</span>
                        <input type="range" id="volumeSlider" min="0" max="100" value="100" title="Volume">
                    </div>
                    <button class="pill-btn" id="audio8dBtn" title="Efek 8D Audio: Mati">🎧 8D</button>
                    <button class="pill-btn" id="downloadHQBtn" title="Render lagu ini lewat filter penjernih lalu unduh sebagai WAV (lossless) untuk diputar offline">⬇️ HQ WAV</button>
                </div>
                <div class="hq-status" id="hqStatus" style="display:none; font-size:0.78rem; color:#888; margin-top:8px;"></div>
            </div>
        </div>

        <!-- Daftar Lagu (Bawah) -->
        <div class="playlist-section">
            <div class="playlist-title">
                <span>DAFTAR LAGU TIAP RT</span>
                <span id="songCount" style="font-weight: normal; font-size: 0.9rem; color: #666;">15 Lagu</span>
            </div>
            <div class="playlist-items" id="playlistContainer">
                <!-- Diisi oleh JavaScript -->
            </div>
            
            <!-- Input File Disembunyikan -->
            <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.opus,.wma" class="visually-hidden-file">
            <button class="add-song-btn" id="uploadBtn">+ Tambah Lagu Lain (di luar 15 RT)</button>
        </div>

        <div class="footer">
            <strong>Dirgahayu Republik Indonesia!</strong>
            Semangat Kebersamaan, Meriahkan Agustusan!
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // 15 slot RT -- KOSONG (belum ada lagu), tinggal diisi lewat ikon
        // upload di masing-masing baris (upload per-RT, lihat renderPlaylist).
        const songs = [
            { rt: "RT 01", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 02", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 03", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 04", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 05", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 06", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 07", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 08", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 09", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 10", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 11", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 12", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 13", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 14", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" },
            { rt: "RT 15", title: null, src: null, cover: "DIRGAHAYU<br>INDONESIA" }
        ];

        let pendingUploadIndex = null; // slot RT yang lagi nunggu file diupload (null = tombol umum)

        let currentSongIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let repeatMode = 'off'; // 'off' | 'all' | 'one'
        let isAutoplay = true;

        const audioPlayer = document.getElementById('audioPlayer');
        audioPlayer.crossOrigin = 'anonymous'; // perlu untuk efek 8D (Web Audio API)
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const autoplayBtn = document.getElementById('autoplayBtn');
        const audio8dBtn = document.getElementById('audio8dBtn');
        const downloadHQBtn = document.getElementById('downloadHQBtn');
        const hqStatus = document.getElementById('hqStatus');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const songTitle = document.getElementById('songTitle');
        const songRT = document.getElementById('songRT');
        const coverArt = document.getElementById('coverArt');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const playlistContainer = document.getElementById('playlistContainer');
        const songCount = document.getElementById('songCount');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');

        // Render Playlist
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            songCount.textContent = `${songs.length} Lagu`;
            
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.classList.add('playlist-item');
                if (index === currentSongIndex) {
                    item.classList.add('active');
                }
                const hasSong = !!song.src;
                item.innerHTML = `
                    <span class="rt-label" contenteditable="true" spellcheck="false">${song.rt}</span>
                    <span class="song-name${hasSong ? '' : ' song-empty'}">${hasSong ? song.title : 'Belum ada lagu'}</span>
                    <button type="button" class="slot-upload-btn" title="Upload lagu untuk ${song.rt}">📤</button>
                    <button type="button" class="slot-upload-btn" title="Hapus lagu ini">🗑️</button>
                `;
                const rtLabelEl = item.querySelector('.rt-label');
                // Klik di label RT buat edit teks -- jangan sampai ikut memicu ganti lagu.
                rtLabelEl.addEventListener('click', (e) => e.stopPropagation());
                rtLabelEl.addEventListener('input', () => {
                    songs[index].rt = rtLabelEl.textContent;
                    if (index === currentSongIndex) songRT.textContent = rtLabelEl.textContent;
                });
                rtLabelEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); rtLabelEl.blur(); }
                });
                // Tombol upload per-slot -- isi/ganti lagu KHUSUS baris RT ini,
                // tidak nambah baris baru.
                const slotUploadBtn = item.querySelector('.slot-upload-btn');
                slotUploadBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    pendingUploadIndex = index;
                    fileInput.click();
                });
                // Tombol hapus -- slot RT tetap (di-reset kosong), lagu tambahan
                // di luar 15 RT (rt==="UPLOAD") langsung dibuang dari daftar.
                const deleteBtn = item.querySelectorAll('.slot-upload-btn')[1];
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (song.src) URL.revokeObjectURL(song.src);
                    if (song.rt === 'UPLOAD') {
                        songs.splice(index, 1);
                        if (currentSongIndex >= songs.length) currentSongIndex = Math.max(0, songs.length - 1);
                        else if (index < currentSongIndex) currentSongIndex--;
                    } else {
                        songs[index].title = null;
                        songs[index].src = null;
                        songs[index].cover = "DIRGAHAYU<br>INDONESIA";
                    }
                    if (index === currentSongIndex || songs[currentSongIndex] === undefined) {
                        loadSong(Math.min(currentSongIndex, Math.max(0, songs.length - 1)));
                    } else {
                        renderPlaylist();
                    }
                });
                item.addEventListener('click', () => {
                    const wasPlaying = isPlaying;
                    loadSong(index);
                    if (wasPlaying) playSong();
                });
                playlistContainer.appendChild(item);
            });
        }

        // Load Song (Hanya memuat, TIDAK langsung play)
        function loadSong(index) {
            currentSongIndex = index;
            const song = songs[index];
            songTitle.textContent = song.src ? song.title : 'Belum ada lagu';
            songRT.textContent = song.rt;
            coverArt.innerHTML = song.cover;
            if (song.src) {
                audioPlayer.src = song.src;
            } else {
                audioPlayer.removeAttribute('src');
                audioPlayer.load();
            }
            
            pauseSong(); 
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '00:00';
            durationTimeEl.textContent = '00:00';
            
            renderPlaylist();
        }

        function playSong() {
            const song = songs[currentSongIndex];
            if (!song.src) {
                // Slot ini belum diisi lagu -- diam saja, jangan coba muter apa-apa.
                isPlaying = false;
                playPauseBtn.innerHTML = '▶️';
                return;
            }
            ensureAudioGraph();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isPlaying = true;
            playPauseBtn.innerHTML = '⏸️';
            audioPlayer.play();
        }

        function pauseSong() {
            isPlaying = false;
            playPauseBtn.innerHTML = '▶️';
            audioPlayer.pause();
        }

        // Ambil index acak yang beda dari index sekarang (kalau lagu > 1)
        function getRandomIndex(exclude) {
            if (songs.length <= 1) return 0;
            let idx;
            do { idx = Math.floor(Math.random() * songs.length); } while (idx === exclude);
            return idx;
        }

        function prevSong() {
            const wasPlaying = isPlaying;
            currentSongIndex = isShuffle
                ? getRandomIndex(currentSongIndex)
                : (currentSongIndex - 1 + songs.length) % songs.length;
            loadSong(currentSongIndex);
            if (wasPlaying) playSong();
        }

        function nextSong() {
            const wasPlaying = isPlaying;
            currentSongIndex = isShuffle
                ? getRandomIndex(currentSongIndex)
                : (currentSongIndex + 1) % songs.length;
            loadSong(currentSongIndex);
            if (wasPlaying) playSong();
        }

        // Dipanggil saat lagu selesai sendiri (bukan diklik manual) --
        // di sinilah mode "Ulang" (repeat) dan "Autoplay" benar-benar berlaku.
        function handleSongEnd() {
            if (!isAutoplay) {
                // Autoplay dimatikan -- berhenti total, jangan lanjut ke lagu apa pun.
                pauseSong();
                audioPlayer.currentTime = 0;
                progressFill.style.width = '0%';
                currentTimeEl.textContent = '00:00';
                return;
            }
            if (repeatMode === 'one') {
                audioPlayer.currentTime = 0;
                playSong();
                return;
            }
            // Repeat mati & bukan shuffle & sudah di lagu terakhir -> berhenti,
            // jangan lompat balik ke lagu pertama sendiri.
            if (repeatMode === 'off' && !isShuffle && currentSongIndex === songs.length - 1) {
                pauseSong();
                audioPlayer.currentTime = 0;
                progressFill.style.width = '0%';
                currentTimeEl.textContent = '00:00';
                return;
            }
            nextSong();
        }

        function updateProgress(e) {
            const { duration, currentTime } = e.srcElement;
            if (duration) {
                const progressPercent = (currentTime / duration) * 100;
                progressFill.style.width = `${progressPercent}%`;
                currentTimeEl.textContent = formatTime(currentTime);
                durationTimeEl.textContent = formatTime(duration);
            }
        }

        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            const duration = audioPlayer.duration;
            if (duration) audioPlayer.currentTime = (clickX / width) * duration;
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Event Listeners
        playPauseBtn.addEventListener('click', () => isPlaying ? pauseSong() : playSong());
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('ended', handleSongEnd);
        progressBar.addEventListener('click', setProgress);

        // Shuffle
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
            shuffleBtn.title = isShuffle ? 'Acak: Aktif' : 'Acak: Mati';
        });

        // Repeat -- siklus: mati -> ulang semua -> ulang 1 lagu -> mati
        const repeatIcons = { off: '🔁', all: '🔁', one: '🔂' };
        const repeatTitles = { off: 'Ulang: Mati', all: 'Ulang: Semua Lagu', one: 'Ulang: Lagu Ini' };
        repeatBtn.addEventListener('click', () => {
            repeatMode = repeatMode === 'off' ? 'all' : (repeatMode === 'all' ? 'one' : 'off');
            repeatBtn.innerHTML = repeatIcons[repeatMode];
            repeatBtn.title = repeatTitles[repeatMode];
            repeatBtn.classList.toggle('active', repeatMode !== 'off');
        });

        // Volume
        volumeSlider.addEventListener('input', () => {
            const vol = volumeSlider.value / 100;
            audioPlayer.volume = vol;
            volumeIcon.textContent = vol == 0 ? '🔇' : (vol < 0.5 ? '🔉' : '🔊');
        });
        audioPlayer.volume = volumeSlider.value / 100;

        // Fullscreen (dengan fallback vendor prefix buat browser/HP lama)
        fullscreenBtn.addEventListener('click', () => {
            const el = document.querySelector('.container');
            const isFs = document.fullscreenElement || document.webkitFullscreenElement;
            if (!isFs) {
                const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                if (req) req.call(el);
            } else {
                const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                if (exit) exit.call(document);
            }
        });
        function syncFullscreenBtn() {
            const isFs = document.fullscreenElement || document.webkitFullscreenElement;
            fullscreenBtn.textContent = isFs ? '⤢' : '⛶';
            fullscreenBtn.title = isFs ? 'Keluar Layar Penuh' : 'Layar Penuh';
        }
        document.addEventListener('fullscreenchange', syncFullscreenBtn);
        document.addEventListener('webkitfullscreenchange', syncFullscreenBtn);

        // Autoplay -- kalau dimatikan, lagu berhenti total begitu selesai
        // (lihat handleSongEnd), tidak lompat ke lagu berikutnya sendiri.
        autoplayBtn.addEventListener('click', () => {
            isAutoplay = !isAutoplay;
            autoplayBtn.classList.toggle('active', isAutoplay);
            autoplayBtn.title = isAutoplay
                ? 'Lanjut otomatis ke lagu berikutnya: Aktif'
                : 'Lanjut otomatis ke lagu berikutnya: Mati';
        });

        // Graph Web Audio -- dipakai untuk DUA hal sekaligus:
        //  1) Penjernih audio yang SELALU aktif otomatis (highshelf + compressor)
        //  2) Efek 8D (panning stereo berputar) lewat tombol 8D, opsional
        // Graph-nya cuma dibuat SEKALI (createMediaElementSource cuma boleh
        // dipanggil sekali per elemen <audio>) -- dipicu otomatis pas lagu
        // pertama kali diputar (lihat playSong()).
        // CATATAN: butuh audio yang sama-origin (upload dari storage = aman)
        // atau server sumbernya izinkan CORS -- kalau tidak, browser akan
        // membisukan audio begitu masuk Web Audio API (bukan bug di sini).
        let audioCtx = null, sourceNode = null, pannerNode = null;
        let is8D = false, panStartTime = 0, panRafId = null;

        function ensureAudioGraph() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioCtx.createMediaElementSource(audioPlayer);
            pannerNode = audioCtx.createStereoPanner();

            // Highshelf halus -- angkat sedikit frekuensi tinggi (vokal/hi-hat/
            // detail) biar kedengaran lebih jernih, tidak berlebihan.
            const clarityNode = audioCtx.createBiquadFilter();
            clarityNode.type = 'highshelf';
            clarityNode.frequency.value = 8000;
            clarityNode.gain.value = 4;

            // Compressor halus -- ratakan volume supaya bagian pelan tetap
            // kedengaran jelas, tanpa bikin bagian keras jadi pecah/distorsi.
            const compressorNode = audioCtx.createDynamicsCompressor();
            compressorNode.threshold.value = -20;
            compressorNode.knee.value = 24;
            compressorNode.ratio.value = 3;
            compressorNode.attack.value = 0.02;
            compressorNode.release.value = 0.25;

            sourceNode.connect(pannerNode).connect(clarityNode).connect(compressorNode).connect(audioCtx.destination);
        }

        function run8DPanLoop() {
            if (!is8D) return;
            const elapsed = audioCtx.currentTime - panStartTime;
            pannerNode.pan.value = Math.sin(elapsed * 0.6); // ~10 detik per putaran kiri-kanan
            panRafId = requestAnimationFrame(run8DPanLoop);
        }

        audio8dBtn.addEventListener('click', () => {
            ensureAudioGraph();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            is8D = !is8D;
            audio8dBtn.classList.toggle('active', is8D);
            audio8dBtn.title = is8D ? 'Efek 8D Audio: Aktif' : 'Efek 8D Audio: Mati';
            if (is8D) {
                panStartTime = audioCtx.currentTime;
                run8DPanLoop();
            } else {
                if (panRafId) cancelAnimationFrame(panRafId);
                pannerNode.pan.value = 0;
            }
        });

        // =========================================================
        // RENDER & UNDUH WAV KUALITAS MAKSIMAL (offline, bisa diputar
        // tanpa internet setelah didownload)
        //
        // CATATAN JUJUR soal "kbps/khz maksimal":
        // Ini TIDAK menciptakan detail suara baru yang tidak ada di file
        // aslinya -- kualitas fisik audio tidak bisa melebihi sumbernya.
        // Yang dilakukan di sini:
        //  1) Lagu dirender ulang lewat OfflineAudioContext, melewati
        //     filter penjernih yang sama dengan yang otomatis aktif saat
        //     diputar (highshelf + compressor) -- jadi efek jernihnya
        //     "terbakar" ke dalam file, bukan cuma efek sementara pas
        //     diputar di browser ini.
        //  2) Hasilnya disimpan sebagai WAV PCM (lossless, TANPA kompresi
        //     seperti MP3), memakai sample rate & jumlah channel asli
        //     file sumbernya -- jadi ini kualitas MAKSIMAL yang mungkin
        //     didapat dari sumbernya, tanpa kehilangan data akibat
        //     kompresi ulang.
        // =========================================================
        async function renderAndDownloadWav() {
            const song = songs[currentSongIndex];
            if (!song || !song.src) {
                alert('Belum ada lagu di slot ini untuk dirender.');
                return;
            }

            downloadHQBtn.disabled = true;
            downloadHQBtn.textContent = '⏳ Merender...';
            hqStatus.style.display = 'block';
            hqStatus.textContent = 'Mengambil & mendekode audio...';

            try {
                const resp = await fetch(song.src);
                const arrayBuffer = await resp.arrayBuffer();

                const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                const decoded = await tempCtx.decodeAudioData(arrayBuffer.slice(0));
                tempCtx.close();

                hqStatus.textContent = `Merender lewat filter penjernih (${decoded.sampleRate} Hz, ${decoded.numberOfChannels === 2 ? 'stereo' : 'mono'})...`;

                const offlineCtx = new OfflineAudioContext(
                    decoded.numberOfChannels,
                    decoded.length,
                    decoded.sampleRate // pakai sample rate ASLI -- tidak upsampling palsu
                );

                const src = offlineCtx.createBufferSource();
                src.buffer = decoded;

                // Sama persis dengan graph "always-on" saat diputar live
                const clarityNode = offlineCtx.createBiquadFilter();
                clarityNode.type = 'highshelf';
                clarityNode.frequency.value = 8000;
                clarityNode.gain.value = 4;

                const compressorNode = offlineCtx.createDynamicsCompressor();
                compressorNode.threshold.value = -20;
                compressorNode.knee.value = 24;
                compressorNode.ratio.value = 3;
                compressorNode.attack.value = 0.02;
                compressorNode.release.value = 0.25;

                src.connect(clarityNode).connect(compressorNode).connect(offlineCtx.destination);
                src.start(0);

                const rendered = await offlineCtx.startRendering();

                hqStatus.textContent = 'Membungkus jadi file WAV...';
                const wavBlob = audioBufferToWav(rendered);

                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a');
                a.href = url;
                const safeName = (song.title || 'lagu').replace(/[\\/:*?"<>|]/g, '_');
                a.download = `${safeName} (HQ ${decoded.sampleRate}Hz).wav`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 15000);

                hqStatus.textContent = `Selesai! Diunduh sebagai WAV ${decoded.sampleRate} Hz, siap diputar offline.`;
                setTimeout(() => { hqStatus.style.display = 'none'; }, 5000);
            } catch (err) {
                console.error(err);
                hqStatus.textContent = '';
                hqStatus.style.display = 'none';
                alert('Gagal merender audio. Kemungkinan file lagu berasal dari server luar yang tidak mengizinkan CORS, atau formatnya tidak didukung browser ini. Lagu yang di-upload langsung dari perangkat biasanya aman.');
            } finally {
                downloadHQBtn.disabled = false;
                downloadHQBtn.textContent = '⬇️ HQ WAV';
            }
        }

        // Ubah AudioBuffer hasil render jadi file WAV PCM 16-bit (lossless)
        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const bitDepth = 16;

            const channelData = [];
            for (let ch = 0; ch < numChannels; ch++) {
                channelData.push(buffer.getChannelData(ch));
            }

            const interleaved = numChannels === 2
                ? interleaveStereo(channelData[0], channelData[1])
                : channelData[0];

            const bytesPerSample = bitDepth / 8;
            const dataLength = interleaved.length * bytesPerSample;
            const bufferArr = new ArrayBuffer(44 + dataLength);
            const view = new DataView(bufferArr);

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);           // ukuran chunk fmt
            view.setUint16(20, 1, true);             // format = PCM
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * bytesPerSample, true); // byte rate
            view.setUint16(32, numChannels * bytesPerSample, true);              // block align
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataLength, true);

            floatTo16BitPCM(view, 44, interleaved);

            return new Blob([view], { type: 'audio/wav' });
        }

        function interleaveStereo(left, right) {
            const length = left.length + right.length;
            const result = new Float32Array(length);
            let index = 0, inputIndex = 0;
            while (index < length) {
                result[index++] = left[inputIndex];
                result[index++] = right[inputIndex];
                inputIndex++;
            }
            return result;
        }

        function floatTo16BitPCM(view, offset, input) {
            for (let i = 0; i < input.length; i++, offset += 2) {
                const s = Math.max(-1, Math.min(1, input[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
        }

        downloadHQBtn.addEventListener('click', renderAndDownloadWav);

        // Tombol umum -- tambah lagu BARU di luar 15 slot RT (bukan isi slot RT)
        uploadBtn.addEventListener('click', () => { pendingUploadIndex = null; fileInput.click(); });
        
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const songUrl = URL.createObjectURL(file);
                const songName = file.name.replace(/\.[^/.]+$/, ""); // Hapus ekstensi .mp3 dll

                if (pendingUploadIndex !== null) {
                    // Isi/ganti lagu KHUSUS slot RT yang tombol upload-nya diklik
                    const idx = pendingUploadIndex;
                    songs[idx].title = songName;
                    songs[idx].src = songUrl;
                    songs[idx].cover = "LAGU<br>UPLOAD";
                    pendingUploadIndex = null;
                    if (idx === currentSongIndex) {
                        loadSong(idx); // refresh tampilan pemutar kalau slot ini lagi aktif
                    } else {
                        renderPlaylist();
                    }
                } else {
                    // Tombol umum -- tambah baris baru di akhir daftar
                    songs.push({
                        rt: "UPLOAD",
                        title: songName,
                        src: songUrl,
                        cover: "LAGU<br>UPLOAD"
                    });
                    renderPlaylist();
                    loadSong(songs.length - 1);
                }
                
                // Reset input agar bisa upload file dengan nama yang sama lagi
                fileInput.value = '';
            }
        });

        // Initial Load
        loadSong(0);
    </script>
</body>
</html>
